<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flair Looks Mock</title>
<!-- Tsukimichi 1.13, Settings › Display › Look › Decoration: Full, Quiet and Plain as three distinct looks.
     Built on docs/plan-site/mock/mock-fragment.html (same markup, tokens and .mk scoping). Every window selector is
     scoped under .mk. Open with #full, #quiet, #plain or #side to choose the view. Medals are the shipped
     Menphina's Medallion SVGs from ../moon-v6/round5/medallion-r5/. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600&family=Marcellus&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--page:#05070D;--pageink:#A9B2CC}
html,body{margin:0;background:var(--page);color:var(--pageink)}
body{font:13px/1.4 "Noto Sans","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}

/* ---------- Page control (not part of the game) ---------- */
.pg{position:relative;height:100vh;display:flex;flex-direction:column;padding:12px 16px 16px;box-sizing:border-box;isolation:isolate}
.pg::before{content:"";position:absolute;inset:-40px;z-index:-2;background:url("../../plan-site/mock/scene-night.jpg") center 35%/cover no-repeat;filter:blur(8px) saturate(.8) brightness(.38)}
.pg::after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(90% 80% at 50% 45%,rgba(4,6,12,0) 0%,rgba(4,6,12,.6) 100%)}
.pbar{display:flex;align-items:center;gap:18px;height:34px;margin-bottom:10px;flex:none}
.pbar .pt{font-size:12.5px;color:#DDE3F0;letter-spacing:.02em}
.pbar .pt b{font-weight:600}
.seg{display:inline-flex;padding:3px;gap:2px;border-radius:9px;background:rgba(10,14,27,.85);border:1px solid #232A42}
.seg button{border:0;background:transparent;color:#A9B2CC;font:inherit;font-size:12.5px;line-height:1;padding:7px 13px;border-radius:7px;cursor:pointer}
.seg button:hover{color:#DDE3F0;background:rgba(255,255,255,.04)}
.seg button[aria-pressed="true"]{background:linear-gradient(#2A3150,#222944);color:#FFF0BE;box-shadow:inset 0 1px 0 rgba(255,240,190,.10),0 1px 2px rgba(0,0,0,.4)}
.pbar .pn{margin-left:auto;font-size:12px;color:#7C86A8}
.host{flex:1;min-height:0;display:flex}
.host>.mk{flex:1}
.side{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-content:start}
.side figure{margin:0;display:flex;flex-direction:column;gap:8px}
.side figcaption{display:flex;align-items:baseline;gap:10px;font-size:12px;color:#A9B2CC}
.side figcaption b{color:#FFF0BE;font-weight:600;font-size:14px}
.side .zw{width:1560px;height:900px;zoom:.3205}
.side .zw>.mk{width:100%;height:100%}

/* ======================================================================================================
   The window. Base = the shared ImGui frame (title bar, toolbar, chips); .full / .quiet / .plain set the look.
   ====================================================================================================== */
.mk{--night:#0F1424;--sunk:#0B0F1C;--raised:#1E2337;--hover:#262D45;--line:#2A3149;--vline:#5C6584;--umbra:#2C334A;
  --silver:#DDE3F0;--mist:#A9B2CC;--dusk:#7C86A8;--veil:#4A5270;--vtext:#8A93B0;--moon:#F2D27A;--moonhi:#FFF0BE;--moondeep:#D6B25A;
  --eclipse:#B25C7F;--etext:#D68AA8;--abyss:#080B16;--top:#151C33;--gilt:#A88B52;--gilthi:#D9BE82;--giltlo:#6E5732;
  position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;color:var(--silver);
  font:500 13px/1.4 "Noto Sans","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-align:left}
.mk *,.mk *::before,.mk *::after{box-sizing:border-box}
.mk img{display:block;border:0}
.mk svg{display:block;overflow:visible}
.mk .win{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;border-radius:7px;overflow:hidden;background:var(--night);
  border:1px solid #2E3550;box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 0 0 1px rgba(0,0,0,.6),0 24px 60px rgba(0,0,0,.6),0 6px 16px rgba(0,0,0,.35)}

/* Dalamud title bar and the toolbar: the same at every level (the host draws the title bar). */
.mk .w-title{height:26px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px;background:#1E2337;border-bottom:1px solid var(--line);font-size:12.5px}
.mk .w-title .tri{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:6px solid var(--mist)}
.mk .w-title .wc{margin-left:auto;display:flex;gap:12px;color:var(--dusk)}
.mk .w-tool{flex:none;display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--top);border-bottom:1px solid var(--line);min-width:0}
.mk .pill-in{height:26px;border-radius:13px;background:var(--sunk);border:1px solid var(--line);display:flex;align-items:center;gap:7px;padding:0 10px;color:var(--dusk);white-space:nowrap;min-width:0;overflow:hidden;flex:0 1 270px}
.mk .qv{display:flex;height:26px;border-radius:13px;background:var(--sunk);border:1px solid var(--line);overflow:hidden;flex:none}
.mk .qv span{display:flex;align-items:center;padding:0 11px;color:var(--mist);border-right:1px solid var(--line);font-size:12px;white-space:nowrap}
.mk .qv span:last-child{border-right:0}
.mk .qv span.on{background:rgba(221,227,240,.08);color:var(--silver)}
.mk .tbtn{height:26px;display:flex;align-items:center;gap:6px;padding:0 10px;color:var(--mist);font-size:12px;white-space:nowrap;flex:none}
.mk .chr{height:26px;border-radius:13px;background:var(--sunk);border:1px solid var(--line);display:flex;align-items:center;gap:7px;padding:0 10px 0 4px;white-space:nowrap;margin-left:auto;flex:none}
.mk .jb{min-width:18px;height:18px;padding:0 3px;border-radius:9px;background:linear-gradient(135deg,#3B4A7A,#1E2437);border:1px solid var(--vline);display:inline-flex;align-items:center;justify-content:center;font-size:8px;font-weight:600;color:var(--silver);letter-spacing:.02em}
.mk .pip{width:6px;height:6px;border-radius:50%;background:var(--moon);flex:none}
.mk .w-chips{flex:none;display:flex;align-items:center;gap:6px;padding:5px 10px;border-bottom:1px solid rgba(42,49,73,.6)}
.mk .chip{height:20px;border-radius:10px;background:var(--raised);border:1px solid var(--line);color:var(--mist);font-size:11.5px;display:inline-flex;align-items:center;gap:6px;padding:0 7px 0 9px}
.mk .chip i{font-style:normal;color:var(--dusk)}
.mk .w-chips .cnt{margin-left:auto;color:var(--dusk);font-size:11.5px}

.mk .w-body{flex:1;min-height:0;display:grid;grid-template-columns:var(--railw) var(--treew) minmax(0,1fr) var(--detw)}
.mk .rail,.mk .tree,.mk .tbl,.mk .det{position:relative;min-height:0;overflow:hidden}
.mk .lay{position:relative;z-index:1}
.mk .ttl,.mk .thd,.mk .rows{position:relative;z-index:1}
.mk .sky{position:absolute;left:0;top:0;width:100%;height:100%;z-index:0;pointer-events:none}

/* Rail */
.mk .rail{border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:8px 0 10px}
.mk .rail .crest{width:44px;height:40px;margin-bottom:4px}
.mk .st{position:relative;width:100%;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--dusk);font-size:10px}
.mk .st svg{width:20px;height:20px}
.mk .st.on{color:var(--silver)}
.mk .st .bd{position:absolute;top:5px;right:8px;min-width:16px;height:14px;padding:0 4px;border-radius:7px;background:var(--moon);color:#1A1406;font-size:9px;display:flex;align-items:center;justify-content:center}
.mk .rail .foot{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:7px}
.mk .rail .foot .pc{font-size:10.5px;color:var(--mist);margin-top:-2px}
.mk .rb{width:28px;height:28px;border-radius:50%;background:var(--raised);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--mist)}
.mk .rb svg{width:13px;height:13px}
.mk .rb.on{color:var(--moon);border-color:rgba(242,210,122,.35);background:rgba(242,210,122,.10)}

/* Tree */
.mk .tree{border-right:1px solid var(--line);padding:var(--pane-pad)}
.mk .tn{height:var(--treeh);display:flex;align-items:center;gap:7px;padding:0 6px 0 4px;border-radius:4px;position:relative;white-space:nowrap;min-width:0}
.mk .tn.l1{padding-left:16px}
.mk .tn .cv{width:9px;color:var(--dusk);font-size:8px;flex:none;text-align:center}
.mk .tn .orb{flex:none}
.mk .tn .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.mk .tn .ct{font-size:10.5px;color:var(--dusk);font-variant-numeric:tabular-nums}
.mk .tn .rdy{font-size:10px;color:var(--moon);background:rgba(242,210,122,.14);border-radius:8px;padding:0 6px;line-height:15px}
.mk .tn.sel{background:rgba(242,210,122,.10)}
.mk .tn.sel::before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:2px;border-radius:1px;background:var(--moon)}

/* Table */
.mk .tbl{display:flex;flex-direction:column}
.mk .cols{display:grid;grid-template-columns:var(--gcol) minmax(0,1.45fr) 44px 66px minmax(0,1.6fr) 46px;align-items:center}
.mk .thd>div{padding:0 6px;white-space:nowrap;overflow:hidden}
.mk .rows{flex:1;min-height:0;overflow:hidden;position:relative}
.mk .grp{display:flex;align-items:center;gap:8px;white-space:nowrap}
.mk .tr{height:var(--rowh);position:relative;cursor:default}
.mk .tr>div{padding:0 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mk .tr .g{display:flex;justify-content:center;align-items:center;padding-left:8px;overflow:visible}
.mk .tr::before{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--stripew);background:var(--stripe,transparent)}
.mk .tr.dash::before{background:repeating-linear-gradient(to bottom,var(--stripe) 0 3px,transparent 3px 5px)}
.mk .tr.dot::before{background:repeating-linear-gradient(to bottom,var(--stripe) 0 1px,transparent 1px 3px)}
.mk .tr .nmc{color:var(--silver)}
.mk .tr .nmc.cp{color:var(--mist)}
.mk .lvp{display:inline-flex;align-items:center;justify-content:center;height:16px;min-width:26px;padding:0 5px;border-radius:8px;background:var(--sunk);color:var(--mist);font-size:11px;font-variant-numeric:tabular-nums}
.mk .jc{display:inline-flex;align-items:center;gap:5px;color:var(--mist);font-size:11.5px}
.mk .jc .jb{font-size:7px;min-width:16px;height:16px}
.mk .jb.tank{background:linear-gradient(#4A78DE,#24448F);border-color:#8EAEF2;min-width:14px;width:14px;height:16px;border-radius:3px 3px 7px 7px}
.mk .stx{color:var(--mist)}
.mk .stx .sw{color:var(--silver)}
.mk .stx .why.ec{color:var(--etext)}
.mk .xpp{color:var(--dusk);font-size:11px}

/* Detail */
.mk .det{border-left:1px solid var(--line);display:flex;flex-direction:column}
.mk .det-in{position:relative;z-index:1;flex:1;min-height:0;display:flex;flex-direction:column;gap:var(--gap);padding:var(--pane-pad);overflow:hidden}
.mk .req{display:flex;align-items:center;gap:8px;min-height:22px;font-size:12.5px;position:relative}
.mk .req .mkr{width:7px;height:7px;border-radius:50%;flex:none;background:var(--moondeep)}
.mk .req.next .mkr{background:transparent;box-shadow:inset 0 0 0 1.5px var(--moon)}
.mk .req.lock .mkr{background:var(--eclipse)}
.mk .req.unk .mkr{background:transparent;box-shadow:inset 0 0 0 1.5px var(--veil)}
.mk .req .d{color:var(--mist);font-size:11.5px;margin-left:auto;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mk .steps{display:flex;gap:3px;margin-top:7px}
.mk .steps i{flex:1;height:5px;border-radius:3px;background:rgba(74,82,112,.45)}
.mk .steps i.dn{background:linear-gradient(var(--moonhi),var(--moon) 55%,var(--moondeep))}
.mk .steps i.cur{background:rgba(242,210,122,.35);box-shadow:inset 0 0 0 1px rgba(242,210,122,.7)}
.mk .rws{display:flex;flex-wrap:wrap;gap:5px}
.mk .rwc{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;line-height:1.2;padding:3px 8px;border-radius:10px;background:var(--sunk);border:1px solid var(--line);color:var(--silver)}
.mk .rwc.uq{border-color:rgba(242,210,122,.5);color:var(--moonhi);background:linear-gradient(rgba(242,210,122,.10),rgba(242,210,122,.04))}
.mk .rwc.uq::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--moon)}
.mk .jt{font-size:11.5px;color:var(--mist);line-height:1.45}
.mk .acts{position:relative;z-index:1;flex:none;display:flex;flex-direction:column}
.mk .acts .pills{display:flex;flex-wrap:wrap}
.mk .apill{display:inline-flex;align-items:center;white-space:nowrap}
.mk .apill svg,.mk .ab svg{width:13px;height:13px}
.mk .acts .rbs{display:flex;flex-wrap:wrap}
.mk .ab{display:flex;align-items:center;justify-content:center;color:var(--mist)}
.mk .acts .prov{font-size:10.5px;color:var(--dusk);white-space:nowrap}

/* Status bar */
.mk .w-stat{flex:none;display:flex;align-items:center;white-space:nowrap;overflow:hidden;color:var(--mist)}
.mk .w-stat .dt{color:var(--veil)}
.mk .w-stat .ver{margin-left:auto;color:var(--veil)}

/* Tooltip (shown on the hovered row) */
.mk .tip{position:absolute;z-index:20;pointer-events:none;white-space:normal}
.mk .tr>.tip{overflow:visible;white-space:normal;text-overflow:clip}

/* ======================================================================================================
   FULL: the Moon Road. Night sky over water, gilt brass, display headings, banners, glows, generous air.
   ====================================================================================================== */
.mk.full{--railw:64px;--treew:292px;--detw:404px;--pane-pad:10px;--gap:12px;--treeh:34px;--rowh:34px;--gcol:38px;--stripew:3px}
.mk.full .win{border-color:#4A4130;box-shadow:inset 0 0 0 1px rgba(217,190,130,.10),0 0 0 1px rgba(0,0,0,.7),0 24px 60px rgba(0,0,0,.65),0 6px 16px rgba(0,0,0,.4)}
/* sky over water: indigo zenith, a faint horizon of moonlight at 58 %, darker water under it */
.mk.full .w-body{background:linear-gradient(180deg,#1B2552 0%,#151D44 18%,#10162E 46%,#0F1424 66%,#111833 88%,#141C3A 100%)}
.mk.full .rail{background:linear-gradient(180deg,rgba(6,8,18,.92),rgba(8,11,22,.86));border-right-color:rgba(168,139,82,.28)}
.mk.full .rail .rule{width:40px;height:1px;background:linear-gradient(90deg,rgba(168,139,82,0),rgba(217,190,130,.9),rgba(168,139,82,0));margin-bottom:8px}
.mk.full .rail .thread{position:absolute;left:6px;top:62px;height:270px;width:1px;background:linear-gradient(rgba(168,139,82,0),rgba(168,139,82,.45) 12%,rgba(168,139,82,.45) 88%,rgba(168,139,82,0))}
.mk.full .st.on svg{color:var(--moon);filter:drop-shadow(0 0 6px rgba(242,210,122,.45))}
.mk.full .st.on::before{content:"";position:absolute;left:5px;top:14px;bottom:14px;width:3px;border-radius:2px;background:linear-gradient(var(--moonhi),var(--moondeep));box-shadow:0 0 8px rgba(242,210,122,.45)}
.mk.full .st.on::after{content:"";position:absolute;left:3.5px;top:10px;width:6px;height:6px;border-radius:50%;background:var(--moonhi);box-shadow:0 0 6px rgba(255,240,190,.7)}
.mk.full .tree{background:transparent;border-right-color:rgba(168,139,82,.22)}
.mk.full .th{display:flex;align-items:center;gap:9px;padding:4px 6px 4px;margin-bottom:4px}
.mk.full .th .sig{width:10px;height:10px;flex:none}
.mk.full .th b{font:600 13px/1 "Barlow Condensed","Noto Sans",sans-serif;letter-spacing:.2em;color:var(--gilthi);text-transform:uppercase}
.mk.full .th .r{flex:1;height:1px;background:linear-gradient(90deg,rgba(217,190,130,.75),rgba(168,139,82,0))}
.mk.full .th span{font-size:10.5px;color:var(--dusk)}
.mk.full .tn .road{position:absolute;left:34px;right:8px;bottom:2px;height:1px;background:linear-gradient(90deg,rgba(168,139,82,.30),rgba(168,139,82,0) 85%)}
.mk.full .tn.sel{background:linear-gradient(90deg,rgba(242,210,122,.16),rgba(242,210,122,.04))}
.mk.full .tn.sel::before{box-shadow:0 0 6px rgba(242,210,122,.6)}
.mk.full .tn .orb{width:22px;height:22px}
/* the moon-road divider: a brass rule fading both ways, a lozenge of light where the road meets the horizon */
.mk.full .mrd{display:flex;align-items:center;gap:8px;height:14px;margin:4px 6px}
.mk.full .mrd i{flex:1;height:1px;background:linear-gradient(90deg,rgba(168,139,82,0),rgba(217,190,130,.75))}
.mk.full .mrd i+b+i{background:linear-gradient(90deg,rgba(217,190,130,.75),rgba(168,139,82,0))}
.mk.full .mrd b{width:6px;height:6px;transform:rotate(45deg);background:linear-gradient(135deg,#FFF0BE,#C9A65C 55%,#7A6236);box-shadow:0 0 6px rgba(242,210,122,.55)}
/* table: the scope's title in the display face, eyebrow header, brass rule */
.mk.full .ttl{display:flex;align-items:baseline;gap:10px;padding:12px 14px 6px}
.mk.full .ttl b{font:400 20px/1.1 Marcellus,Georgia,serif;color:var(--silver);letter-spacing:.02em;text-shadow:0 1px 0 rgba(0,0,0,.5)}
.mk.full .ttl span{font:600 12px/1 "Barlow Condensed",sans-serif;letter-spacing:.16em;color:var(--gilthi);text-transform:uppercase}
.mk.full .ttl em{margin-left:auto;font-style:normal;font-size:11px;color:var(--dusk)}
.mk.full .thd{height:26px;font:600 11.5px/1 "Barlow Condensed",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--dusk);position:relative}
.mk.full .thd .sort{color:var(--gilthi)}
.mk.full .thd::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:1px;background:linear-gradient(90deg,rgba(168,139,82,0),rgba(217,190,130,.8) 18%,rgba(168,139,82,.55) 70%,rgba(168,139,82,0))}
.mk.full .grp{height:34px;padding:8px 14px 0}
.mk.full .grp b{font:600 12.5px/1 "Barlow Condensed",sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--gilthi)}
.mk.full .grp span{font-size:11px;color:var(--dusk)}
.mk.full .grp::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(168,139,82,.55),rgba(168,139,82,0))}
.mk.full .tr{border-bottom:1px solid rgba(42,49,73,.35);font-size:13px}
.mk.full .tr:nth-child(even of .tr){background:rgba(120,140,200,.025)}
.mk.full .tr.sel{background:linear-gradient(90deg,rgba(242,210,122,.13),rgba(242,210,122,.035) 60%,rgba(242,210,122,.02));box-shadow:inset 0 1px 0 rgba(217,190,130,.35),inset 0 -1px 0 rgba(217,190,130,.35)}
.mk.full .tr.hov{background:rgba(38,45,69,.75)}
.mk.full .tr.rdy::after{content:"";position:absolute;left:38px;right:30%;bottom:-1px;height:1px;background:linear-gradient(90deg,rgba(242,210,122,.55),rgba(242,210,122,0));box-shadow:0 0 4px rgba(242,210,122,.35)}
.mk.full .tr .g img{filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.55))}
.mk.full .tr.rdy .g img{filter:drop-shadow(0 0 4px rgba(242,210,122,.45)) drop-shadow(0 1px 1px rgba(0,0,0,.5))}
/* detail */
.mk.full .det{border-left-color:rgba(168,139,82,.28);background:linear-gradient(180deg,rgba(12,16,34,.25),rgba(10,14,30,.55))}
.mk.full .det-in{padding:10px 12px 12px}
.mk.full .ban{position:relative;flex:none;height:156px;border-radius:5px;background:#1B2240;box-shadow:0 0 0 1px rgba(217,190,130,.42),0 6px 18px rgba(0,0,0,.45);margin-bottom:-6px}
/* Night grade, at draw time, in this order: multiply #2A3768 at .70 (.55 left the daylight banner at mean L 65), desaturate 35 %, scrim to Night, MoonHigh wash from the upper left. */
.mk.full .ban .art{position:absolute;inset:0;border-radius:5px;overflow:hidden;isolation:isolate;filter:saturate(.65)}
.mk.full .ban .art .img{position:absolute;inset:0;background-size:cover;background-repeat:no-repeat}
.mk.full .ban .art .mul{position:absolute;inset:0;background:#2A3768;mix-blend-mode:multiply;opacity:.70}
.mk.full .ban .scrim{position:absolute;inset:0;border-radius:5px;background:linear-gradient(180deg,rgba(15,20,36,0) 0%,rgba(15,20,36,.25) 45%,rgba(15,20,36,.85) 100%)}
.mk.full .ban .wash{position:absolute;inset:0;border-radius:5px;background:radial-gradient(90% 110% at 0 0,rgba(255,240,190,.06),rgba(255,240,190,0) 70%)}
.mk.full .ban .road{position:absolute;left:0;right:0;bottom:0;height:34px;width:100%}
.mk.full .ban .t{position:absolute;z-index:1;left:104px;right:12px;bottom:12px}

  var CREST = '<svg class="crest" viewBox="0 0 44 40" aria-hidden="true"><defs><radialGradient id="crg" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#FFF6D8"/><stop offset=".6" stop-color="#E9E4D2"/><stop offset="1" stop-color="#BFC6DA"/></radialGradient></defs>' +
    '<circle cx="22" cy="14" r="11" fill="#F2D27A" opacity=".08"/><path d="M26.5 5.2a9 9 0 1 0 2.9 15.6A7.2 7.2 0 0 1 26.5 5.2z" fill="url(#crg)"/>' +
    '<path d="M6 29h32" stroke="#A88B52" stroke-width=".8" opacity=".7"/><path d="M19 31.5h6M17.5 34h9M20 36.5h4" stroke="#E9E4D2" stroke-width="1.1" stroke-linecap="round" opacity=".55"/></svg>';

  // ---------- Window ----------
  function frame() {
    return '<div class="w-title"><span class="tri"></span>Tsukimichi<span class="wc">' + ICON.gear + ICON.x + '</span></div>' +
      '<div class="w-tool"><div class="pill-in">' + ICON.search + '<span>Search quests, rewards or ids</span></div>' +
      '<div class="qv"><span class="on">All</span><span>Unlocks</span><span>My level</span><span>Stalled</span><span>Story sidequests</span></div>' +
      '<div class="tbtn">' + ICON.filt + 'Filters</div>' +
      '<div class="chr"><span class="jb">WHM</span><span>Michiru Tsukikage</span><span style="color:var(--dusk)">Balmung</span><span class="pip"></span></div></div>' +
      '<div class="w-chips"><span class="chip">Pinned <i>✕</i></span><span class="cnt">' + Q.length + ' of ' + Q.length + '</span></div>';
  }

  function rail(lv) {
    var st = [["Journal", ICON.book, "41"], ["Moonlit", ICON.moon], ["Characters", ICON.chars], ["Flight", ICON.flight], ["My blues", ICON.blues]];
    var h = '<nav class="rail">' + (lv === "full" ? stars(7, 64, 900, 30, .8) : "") + '<div class="lay" style="display:flex;flex-direction:column;align-items:center;width:100%;flex:1">';
    h += CREST + '<div class="rule"></div>' + (lv === "full" ? '<div class="thread"></div>' : "");
    st.forEach(function (s, k) { h += '<div class="st' + (k === 0 ? " on" : "") + '">' + (s[2] ? '<span class="bd">' + s[2] + "</span>" : "") + s[1] + '<span class="lb">' + s[0] + "</span></div>"; });
    h += '<div class="foot">' + (lv === "plain" ? "" : orbit(0.65, lv).replace('class="orb"', 'class="orb" style="width:30px;height:30px"') + '<span class="pc">65%</span>') +
      '<div class="rb on">' + ICON.todo + '</div><div class="rb">' + ICON.pinmap + '</div><div class="rb">' + ICON.help + '</div><div class="rb">' + ICON.set + "</div></div>";
    return h + "</div></nav>";
  }

  function tree(lv) {
    var h = '<div class="tree">' + (lv === "full" ? stars(31, 292, 820, 34, 1, .64, .04, .96) : "") + '<div class="lay">';
    h += '<div class="th">' + ICON.sig + "<b>Journal</b>" + (lv === "full" ? '<i class="r"></i>' : "") + "<span>5,373 quests</span></div>";
    TREE.forEach(function (t, k) {
      if (t[0] === "hair") { h += lv === "full" ? '<div class="mrd"><i></i><b></b><i></i></div>' : '<div class="hr"></div>'; return; }
      h += '<div class="tn' + (t[0] ? " " + t[0] : "") + (k === 0 ? " sel" : "") + '"><span class="cv">' + (t[0] === "sec" ? "▸" : "") + "</span>";
      if (lv !== "plain") h += orbit(t[3], lv);
      h += '<span class="nm">' + esc(t[1]) + "</span>";
      if (t[4]) h += '<span class="rdy">' + t[4] + "" + "</span>";
      h += '<span class="ct">' + t[2] + "</span>";
      if (lv === "plain") h += '<span class="pct">' + Math.round(t[3] * 100) + "%</span>";
      if (lv === "full" && t[0] === "sec") h += '<span class="road"></span>';
      h += "</div>";
    });
    return h + "</div></div>";
  }

  function table(lv) {
    var h = '<div class="tbl" role="grid">';
    if (lv === "full") h += stars(97, 900, 34, 16, .8, .15, .34, .8).replace('class="sky"', 'class="sky" style="height:34px"');
    if (lv !== "plain") h += '<div class="ttl"><b>Pinned</b><span>' + Q.length + ' quests</span><em>sorted by name</em></div>';
    h += '<div class="thd cols"><div></div><div class="sort">Name ▴</div><div>Lv</div><div>Job</div><div>Status</div><div>Exp</div></div><div class="rows">';
    var groups = [];
    Q.forEach(function (q) { if (groups.indexOf(q.g) < 0) groups.push(q.g); });
    groups.forEach(function (g) {
      var items = Q.filter(function (q) { return q.g === g; });
      h += '<div class="grp"><b>' + esc(g) + "</b><span>" + items.length + "</span></div>";
      items.forEach(function (q) {
        var i = Q.indexOf(q);
        var cls = "tr cols" + (STRIPE[q.st][1] ? " " + STRIPE[q.st][1] : "") + (i === SEL ? " sel" : "") + (q.tip ? " hov" : "") + (q.st === "ready" ? " rdy" : "");
        h += '<div class="' + cls + '" style="--stripe:' + STRIPE[q.st][0] + '"><div class="g">' + rowGlyph(lv, q.st) + "</div>";
        h += '<div class="nmc' + (q.st === "completed" ? " cp" : "") + '">' + esc(q.n) + "</div>";
        h += '<div><span class="lvp">' + q.lv + "</span></div>";
        var job = q.job === "All" ? "Any" : q.job === "Tank" ? '<span class="jb tank"></span>Tank' : '<span class="jb">' + q.job + "</span>" + (lv === "plain" ? q.job : "");
        h += '<div><span class="jc">' + job + "</span></div>";
        h += '<div class="stx"><span class="sw">' + esc(q.lab) + "</span>" + (q.det ? ' · <span class="why' + (q.st === "blocked" || q.st === "locked-out" ? " ec" : "") + '">' + esc(q.det) + "</span>" : "") + "</div>";
        h += '<div class="xpp">' + q.xp + "</div>";
        if (q.tip) h += tip(lv, q.st);
        h += "</div>";
      });
    });
    return h + "</div></div>";
  }

  function tip(lv, st) {
    if (lv === "full") return '<div class="tip"><i class="cm a"></i><i class="cm d"></i><div class="tg">' + medalImg(st, 40) + "<div><b>" + NAME[st] + "</b><p>" + MEAN[st] + "</p></div></div></div>";
    if (lv === "quiet") return '<div class="tip"><div class="tg">' + quietMedal(st, 28) + "<div><b>" + NAME[st] + "</b><p>" + MEAN[st] + "</p></div></div></div>";
    return '<div class="tip"><b>' + NAME[st] + ".</b> <p>" + MEAN[st] + "</p></div>";
  }

  function card(lv, inner) { return '<div class="card">' + (lv === "full" ? '<i class="cm a"></i><i class="cm b"></i><i class="cm c"></i><i class="cm d"></i>' : "") + inner + "</div>"; }
  function reqs(q) { return q.req.map(function (x) { return '<div class="req ' + x[0] + '"><span class="mkr"></span><span>' + esc(x[1]) + '</span><span class="d">' + esc(x[2]) + "</span></div>"; }).join(""); }
  function steps(q) { var s = '<div class="steps">'; for (var k = 1; k <= q.steps[1]; k++) s += "<i" + (k < q.steps[0] ? ' class="dn"' : k === q.steps[0] ? ' class="cur"' : "") + "></i>"; return s + "</div>"; }
  function actions(lv) {
    var h = '<div class="acts"><div class="pills">';
    [["Go to giver", "arrow", 1], ["Teleport", "plane"], ["Walk to giver", "walk"]].forEach(function (p) { h += '<div class="apill' + (p[2] ? " pri" : "") + '">' + ICON[p[1]] + "<span>" + p[0] + "</span></div>"; });
    h += '</div><div class="rbs">';
    ["pin", "path", "flag", "link", "copy", "book", "more"].forEach(function (k) { h += '<div class="ab">' + (k === "book" ? ICON.book.replace('viewBox="0 0 20 20"', 'viewBox="0 0 20 20" style="width:14px;height:14px"') : ICON[k]) + "</div>"; });
    return h + '</div><div class="prov">Checked 21:14 · live</div></div>';
  }

  function detail(lv) {
    var q = Q[SEL], h = '<aside class="det">';
    h += '<div class="det-in">';
    var unmet = q.req.filter(function (x) { return x[0] !== "ok"; }).length;
    var reqHead = unmet ? unmet + " of " + q.req.length + " unmet" : "All met";
    if (lv === "full") {
      h += '<div class="ban"><div class="art"><div class="img" style="background-image:url(\'' + SCENE[q.art] + '\');background-position:' + q.pos + '"></div><i class="mul"></i></div><i class="scrim"></i><i class="wash"></i>' + road() +
        '<div class="t"><div class="n">' + esc(q.n) + '</div><div class="m">' + esc(q.path) + " · Lv " + q.lv + "</div></div>" +
        '<div class="hm' + (q.st === "ready" || q.st === "ready-on-another-job" ? " lit" : "") + '">' + medalImg(q.st, 80, true) + "</div></div>";
      h += '<div class="hero"><div class="hl" style="color:' + INK[q.st] + '">' + NAME[q.st] + '</div><div class="hd">' + esc(q.det) + "</div>" + steps(q) + "</div>";
      h += '<div class="mrd"><i></i><b></b><i></i></div>';
      h += card(lv, "<h4>Requirements<span class=\"r\">" + reqHead + "</span></h4>" + reqs(q));
      h += card(lv, '<h4>Rewards<span class="r">2 unique</span></h4><div class="rws">' + q.rw.map(function (x) { return '<span class="rwc uq">' + esc(x[0]) + "</span>"; }).join("") + "</div>");
      h += card(lv, '<h4>Journal<span class="r jbtn">Read the journal</span></h4><div class="jt">The journal entries so far, up to the step you are on. Later entries appear as the quest goes on.</div>');
      h += card(lv, '<h4>Giver</h4><div class="giver">' + esc(q.giver) + ' <span class="z">· ' + esc(q.zone) + "</span></div>");
    } else if (lv === "quiet") {
      h += '<div class="qh"><div class="n">' + esc(q.n) + '</div><div class="m">' + esc(q.path) + " · Lv " + q.lv + "</div></div>";
      h += '<div class="hero">' + quietMedal(q.st, 52, true) + '<div><div class="hl" style="color:' + INK[q.st] + '">' + NAME[q.st] + '</div><div class="hd">' + esc(q.det) + "</div>" + steps(q) + "</div></div>";
      h += card(lv, "<h4>Requirements<span class=\"r\">" + reqHead + "</span></h4>" + reqs(q));
      h += card(lv, '<h4>Rewards<span class="r">2 unique</span></h4><div class="rws">' + q.rw.map(function (x) { return '<span class="rwc uq">' + esc(x[0]) + "</span>"; }).join("") + "</div>");
      h += card(lv, '<h4>Journal<span class="r jbtn">Read the journal</span></h4><div class="jt">The journal entries so far, up to the step you are on. Later entries appear as the quest goes on.</div>');
      h += card(lv, '<h4>Giver</h4><div class="giver">' + esc(q.giver) + ' <span class="z">· ' + esc(q.zone) + "</span></div>");
    } else {
      h += '<div class="ph"><div class="n">' + esc(q.n) + '</div><div class="m">' + esc(q.path) + "</div></div>";
      h += '<dl class="kv"><dt>State</dt><dd>' + flatGlyph(q.st, 12) + '<span style="color:' + INK[q.st] + '">' + NAME[q.st] + '</span><span class="mu">· ' + esc(q.det) + "</span></dd>" +
        "<dt>Level</dt><dd>" + q.lv + ' <span class="mu">· any job · ' + q.xp + "</span></dd>" +
        "<dt>Giver</dt><dd>" + esc(q.giver) + ' <span class="mu">· ' + esc(q.zone) + "</span></dd></dl>";
      h += '<div class="ps">Requirements<span>' + reqHead.toLowerCase() + "</span></div>" + reqs(q);
      h += '<div class="ps">Rewards<span>2 unique</span></div>' + q.rw.map(function (x) { return '<div class="rl">' + esc(x[0]) + '<span class="u">unique</span></div>'; }).join("");
      h += '<div class="ps">Journal<span>step 4 of 6</span></div><div class="jl"><u>Read the journal</u> · entries so far</div>';
    }
    h += "</div>" + actions(lv) + "</aside>";
    return h;
  }

  function status(lv) {
    var h = '<div class="w-stat">';
    if (lv === "full") {
      h += orbit(0.65, "full").replace('class="orb"', 'class="hal"') + "<span>65%</span>" + '<span class="dt">·</span><span>5,373 quests · showing ' + Q.length + " of " + Q.length + "</span>" +
        '<span class="dt">·</span><span class="pip"></span><span>live</span><span class="dt">·</span><span class="msq">' + medalImg("in-journal", 16) + "MSQ · Dawntrail ›</span>";
    } else if (lv === "quiet") {
      h += orbit(0.65, "quiet").replace('class="orb"', 'class="hal"') + "<span>65%</span>" + '<span class="dt">·</span><span>5,373 quests · showing ' + Q.length + " of " + Q.length + "</span>" +
        '<span class="dt">·</span><span class="pip"></span><span>live</span><span class="dt">·</span><span class="msq">MSQ · Dawntrail ›</span>';
    } else {
      h += "<span>65% · 5,373 quests · showing " + Q.length + " of " + Q.length + '</span><span class="dt">|</span><span class="pip"></span><span>live</span><span class="dt">|</span><span>MSQ: <span class="msq">Dawntrail</span></span>';
    }
    return h + '<span class="ver">v1.13.0</span></div>';
  }

  function win(lv) {
    return '<div class="mk ' + lv + '"><div class="win">' + frame() + '<div class="w-body">' + rail(lv) + tree(lv) + table(lv) + detail(lv) + "</div>" + status(lv) + "</div></div>";
  }

  // ---------- Page ----------
  var host = document.getElementById("host"), seg = document.getElementById("seg"), pn = document.getElementById("pn");
  function show(v) {
    if (!NOTE[v] && v !== "glyphs") v = "full";
    seg.querySelectorAll("button").forEach(function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-v") === v ? "true" : "false"); });
    pn.textContent = NOTE[v];
    if (v === "glyphs") {
      host.innerHTML = '<div id="gm" style="background:#11151F;display:flex;gap:8px;position:fixed;left:0;top:0;padding:4px">' + STATES.map(function (k) { return '<div style="width:12px;height:12px">' + flatGlyph(k, 12) + "</div>"; }).join("") + "</div>";
      return;
    }
    if (v === "side") {
      host.innerHTML = '<div class="side">' + ["full", "quiet", "plain"].map(function (l) {
        return '<figure><figcaption><b>' + l.charAt(0).toUpperCase() + l.slice(1) + "</b>" + NOTE[l].split(": ")[1].split(".")[0] + '</figcaption><div class="zw">' + win(l) + "</div></figure>";
      }).join("") + "</div>";
    } else {
      host.innerHTML = win(v);
    }
  }
  seg.addEventListener("click", function (e) { var b = e.target.closest("button"); if (b) { location.hash = b.getAttribute("data-v"); } });
  window.addEventListener("hashchange", function () { show(location.hash.slice(1)); });
  show(location.hash.slice(1) || "full");
})();
</script>
</body>
</html>
