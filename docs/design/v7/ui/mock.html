<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan v7 UI Mock</title>
<!-- Tsukimichi plan v7, UI points 1, 2, 3, 5, 6 and 8: section headings, the filter drawer, the star field, the Completed
     moon, the Journal column headers and the left rail. Extends docs/design/flair-v13/mock.html: its CSS is carried over
     verbatim (paths re-rooted) and every v7 change is a rule scoped under .mk.v7, so "1.13" is the same markup without
     the class. Views: #full #quiet #plain (append /before for 1.13, /open or /open-adv for the drawer), #drawer, #rail,
     #stars, #ba. Medals are the shipped Menphina's Medallion SVGs; Completed in v7 is completed-moon/completed-v7.svg.
     Built by a small script from the v13 file; edit the v7 layer, not the copied v13 block. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600&family=Marcellus&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ===================== flair-v13 mock CSS, verbatim ===================== */

:root{--page:#05070D;--pageink:#A9B2CC}
html,body{margin:0;background:var(--page);color:var(--pageink)}
body{font:13px/1.4 "Noto Sans","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}

/* ---------- Page control (not part of the game) ---------- */
.pg{position:relative;height:100vh;display:flex;flex-direction:column;padding:12px 16px 16px;box-sizing:border-box;isolation:isolate}
.pg::before{content:"";position:absolute;inset:-40px;z-index:-2;background:url("../../../plan-site/mock/scene-night.jpg") center 35%/cover no-repeat;filter:blur(8px) saturate(.8) brightness(.38)}
.pg::after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(90% 80% at 50% 45%,rgba(4,6,12,0) 0%,rgba(4,6,12,.6) 100%)}
.pbar{display:flex;align-items:center;gap:18px;height:34px;margin-bottom:10px;flex:none}
.pbar .pt{font-size:12.5px;color:#DDE3F0;letter-spacing:.02em}
.pbar .pt b{font-weight:600}
.seg{display:inline-flex;padding:3px;gap:2px;border-radius:9px;background:rgba(10,14,27,.85);border:1px solid #232A42}
.seg button{border:0;background:transparent;color:#A9B2CC;font:inherit;font-size:12.5px;line-height:1;padding:7px 13px;border-radius:7px;cursor:pointer}
.seg button:hover{color:#DDE3F0;background:rgba(255,255,255,.04)}
.seg button[aria-pressed="true"]{background:linear-gradient(#2A3150,#222944);color:#FFF0BE;box-shadow:inset 0 1px 0 rgba(255,240,190,.10),0 1px 2px rgba(0,0,0,.4)}
.pbar .pn{margin-left:auto;font-size:12px;color:#7C86A8}
.host{flex:1;min-height:0;display:flex}
.host>.mk{flex:1}
.side{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-content:start}
.side figure{margin:0;display:flex;flex-direction:column;gap:8px}
.side figcaption{display:flex;align-items:baseline;gap:10px;font-size:12px;color:#A9B2CC}
.side figcaption b{color:#FFF0BE;font-weight:600;font-size:14px}
.side .zw{width:1560px;height:900px;zoom:.3205}
.side .zw>.mk{width:100%;height:100%}

/* ======================================================================================================
   The window. Base = the shared ImGui frame (title bar, toolbar, chips); .full / .quiet / .plain set the look.
   ====================================================================================================== */
.mk{--night:#0F1424;--sunk:#0B0F1C;--raised:#1E2337;--hover:#262D45;--line:#2A3149;--vline:#5C6584;--umbra:#2C334A;
  --silver:#DDE3F0;--mist:#A9B2CC;--dusk:#7C86A8;--veil:#4A5270;--vtext:#8A93B0;--moon:#F2D27A;--moonhi:#FFF0BE;--moondeep:#D6B25A;
  --eclipse:#B25C7F;--etext:#D68AA8;--abyss:#080B16;--top:#151C33;--gilt:#A88B52;--gilthi:#D9BE82;--giltlo:#6E5732;
  position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;color:var(--silver);
  font:500 13px/1.4 "Noto Sans","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-align:left}
.mk *,.mk *::before,.mk *::after{box-sizing:border-box}
.mk img{display:block;border:0}
.mk svg{display:block;overflow:visible}
.mk .win{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;border-radius:7px;overflow:hidden;background:var(--night);
  border:1px solid #2E3550;box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 0 0 1px rgba(0,0,0,.6),0 24px 60px rgba(0,0,0,.6),0 6px 16px rgba(0,0,0,.35)}

/* Dalamud title bar and the toolbar: the same at every level (the host draws the title bar). */
.mk .w-title{height:26px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px;background:#1E2337;border-bottom:1px solid var(--line);font-size:12.5px}
.mk .w-title .tri{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:6px solid var(--mist)}
.mk .w-title .wc{margin-left:auto;display:flex;gap:12px;color:var(--dusk)}
.mk .w-tool{flex:none;display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--top);border-bottom:1px solid var(--line);min-width:0}
.mk .pill-in{height:26px;border-radius:13px;background:var(--sunk);border:1px solid var(--line);display:flex;align-items:center;gap:7px;padding:0 10px;color:var(--dusk);white-space:nowrap;min-width:0;overflow:hidden;flex:0 1 270px}
.mk .qv{display:flex;height:26px;border-radius:13px;background:var(--sunk);border:1px solid var(--line);overflow:hidden;flex:none}
.mk .qv span{display:flex;align-items:center;padding:0 11px;color:var(--mist);border-right:1px solid var(--line);font-size:12px;white-space:nowrap}
.mk .qv span:last-child{border-right:0}
.mk .qv span.on{background:rgba(221,227,240,.08);color:var(--silver)}
.mk .tbtn{height:26px;display:flex;align-items:center;gap:6px;padding:0 10px;color:var(--mist);font-size:12px;white-space:nowrap;flex:none}
.mk .chr{height:26px;border-radius:13px;background:var(--sunk);border:1px solid var(--line);display:flex;align-items:center;gap:7px;padding:0 10px 0 4px;white-space:nowrap;margin-left:auto;flex:none}
.mk .jb{min-width:18px;height:18px;padding:0 3px;border-radius:9px;background:linear-gradient(135deg,#3B4A7A,#1E2437);border:1px solid var(--vline);display:inline-flex;align-items:center;justify-content:center;font-size:8px;font-weight:600;color:var(--silver);letter-spacing:.02em}
.mk .pip{width:6px;height:6px;border-radius:50%;background:var(--moon);flex:none}
.mk .w-chips{flex:none;display:flex;align-items:center;gap:6px;padding:5px 10px;border-bottom:1px solid rgba(42,49,73,.6)}
.mk .chip{height:20px;border-radius:10px;background:var(--raised);border:1px solid var(--line);color:var(--mist);font-size:11.5px;display:inline-flex;align-items:center;gap:6px;padding:0 7px 0 9px}
.mk .chip i{font-style:normal;color:var(--dusk)}
.mk .w-chips .cnt{margin-left:auto;color:var(--dusk);font-size:11.5px}

.mk .w-body{flex:1;min-height:0;display:grid;grid-template-columns:var(--railw) var(--treew) minmax(0,1fr) var(--detw)}
.mk .rail,.mk .tree,.mk .tbl,.mk .det{position:relative;min-height:0;overflow:hidden}
.mk .lay{position:relative;z-index:1}
.mk .ttl,.mk .thd,.mk .rows{position:relative;z-index:1}
.mk .sky{position:absolute;left:0;top:0;width:100%;height:100%;z-index:0;pointer-events:none}

/* Rail */
.mk .rail{border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:8px 0 10px}
.mk .rail .crest{width:44px;height:40px;margin-bottom:4px}
.mk .st{position:relative;width:100%;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--dusk);font-size:10px}
.mk .st svg{width:20px;height:20px}
.mk .st.on{color:var(--silver)}
.mk .st .bd{position:absolute;top:5px;right:8px;min-width:16px;height:14px;padding:0 4px;border-radius:7px;background:var(--moon);color:#1A1406;font-size:9px;display:flex;align-items:center;justify-content:center}
.mk .rail .foot{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:7px}
.mk .rail .foot .pc{font-size:10.5px;color:var(--mist);margin-top:-2px}
.mk .rb{width:28px;height:28px;border-radius:50%;background:var(--raised);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--mist)}
.mk .rb svg{width:13px;height:13px}
.mk .rb.on{color:var(--moon);border-color:rgba(242,210,122,.35);background:rgba(242,210,122,.10)}

/* Tree */
.mk .tree{border-right:1px solid var(--line);padding:var(--pane-pad)}
.mk .tn{height:var(--treeh);display:flex;align-items:center;gap:7px;padding:0 6px 0 4px;border-radius:4px;position:relative;white-space:nowrap;min-width:0}
.mk .tn.l1{padding-left:16px}
.mk .tn .cv{width:9px;color:var(--dusk);font-size:8px;flex:none;text-align:center}
.mk .tn .orb{flex:none}
.mk .tn .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.mk .tn .ct{font-size:10.5px;color:var(--dusk);font-variant-numeric:tabular-nums}
.mk .tn .rdy{font-size:10px;color:var(--moon);background:rgba(242,210,122,.14);border-radius:8px;padding:0 6px;line-height:15px}
.mk .tn.sel{background:rgba(242,210,122,.10)}
.mk .tn.sel::before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:2px;border-radius:1px;background:var(--moon)}

/* Table */
.mk .tbl{display:flex;flex-direction:column}
.mk .cols{display:grid;grid-template-columns:var(--gcol) minmax(0,1.45fr) 44px 66px minmax(0,1.6fr) 46px;align-items:center}
.mk .thd>div{padding:0 6px;white-space:nowrap;overflow:hidden}
.mk .rows{flex:1;min-height:0;overflow:hidden;position:relative}
.mk .grp{display:flex;align-items:center;gap:8px;white-space:nowrap}
.mk .tr{height:var(--rowh);position:relative;cursor:default}
.mk .tr>div{padding:0 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mk .tr .g{display:flex;justify-content:center;align-items:center;padding-left:8px;overflow:visible}
.mk .tr::before{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--stripew);background:var(--stripe,transparent)}
.mk .tr.dash::before{background:repeating-linear-gradient(to bottom,var(--stripe) 0 3px,transparent 3px 5px)}
.mk .tr.dot::before{background:repeating-linear-gradient(to bottom,var(--stripe) 0 1px,transparent 1px 3px)}
.mk .tr .nmc{color:var(--silver)}
.mk .tr .nmc.cp{color:var(--mist)}
.mk .lvp{display:inline-flex;align-items:center;justify-content:center;height:16px;min-width:26px;padding:0 5px;border-radius:8px;background:var(--sunk);color:var(--mist);font-size:11px;font-variant-numeric:tabular-nums}
.mk .jc{display:inline-flex;align-items:center;gap:5px;color:var(--mist);font-size:11.5px}
.mk .jc .jb{font-size:7px;min-width:16px;height:16px}
.mk .jb.tank{background:linear-gradient(#4A78DE,#24448F);border-color:#8EAEF2;min-width:14px;width:14px;height:16px;border-radius:3px 3px 7px 7px}
.mk .stx{color:var(--mist)}
.mk .stx .sw{color:var(--silver)}
.mk .stx .why.ec{color:var(--etext)}
.mk .xpp{color:var(--dusk);font-size:11px}

/* Detail */
.mk .det{border-left:1px solid var(--line);display:flex;flex-direction:column}
.mk .det-in{position:relative;z-index:1;flex:1;min-height:0;display:flex;flex-direction:column;gap:var(--gap);padding:var(--pane-pad);overflow:hidden}
.mk .req{display:flex;align-items:center;gap:8px;min-height:22px;font-size:12.5px;position:relative}
.mk .req .mkr{width:7px;height:7px;border-radius:50%;flex:none;background:var(--moondeep)}
.mk .req.next .mkr{background:transparent;box-shadow:inset 0 0 0 1.5px var(--moon)}
.mk .req.lock .mkr{background:var(--eclipse)}
.mk .req.unk .mkr{background:transparent;box-shadow:inset 0 0 0 1.5px var(--veil)}
.mk .req .d{color:var(--mist);font-size:11.5px;margin-left:auto;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mk .steps{display:flex;gap:3px;margin-top:7px}
.mk .steps i{flex:1;height:5px;border-radius:3px;background:rgba(74,82,112,.45)}
.mk .steps i.dn{background:linear-gradient(var(--moonhi),var(--moon) 55%,var(--moondeep))}
.mk .steps i.cur{background:rgba(242,210,122,.35);box-shadow:inset 0 0 0 1px rgba(242,210,122,.7)}
.mk .rws{display:flex;flex-wrap:wrap;gap:5px}
.mk .rwc{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;line-height:1.2;padding:3px 8px;border-radius:10px;background:var(--sunk);border:1px solid var(--line);color:var(--silver)}
.mk .rwc.uq{border-color:rgba(242,210,122,.5);color:var(--moonhi);background:linear-gradient(rgba(242,210,122,.10),rgba(242,210,122,.04))}
.mk .rwc.uq::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--moon)}
.mk .jt{font-size:11.5px;color:var(--mist);line-height:1.45}
.mk .acts{position:relative;z-index:1;flex:none;display:flex;flex-direction:column}
.mk .acts .pills{display:flex;flex-wrap:wrap}
.mk .apill{display:inline-flex;align-items:center;white-space:nowrap}
.mk .apill svg,.mk .ab svg{width:13px;height:13px}
.mk .acts .rbs{display:flex;flex-wrap:wrap}
.mk .ab{display:flex;align-items:center;justify-content:center;color:var(--mist)}
.mk .acts .prov{font-size:10.5px;color:var(--dusk);white-space:nowrap}

/* Status bar */
.mk .w-stat{flex:none;display:flex;align-items:center;white-space:nowrap;overflow:hidden;color:var(--mist)}
.mk .w-stat .dt{color:var(--veil)}
.mk .w-stat .ver{margin-left:auto;color:var(--veil)}

/* Tooltip (shown on the hovered row) */
.mk .tip{position:absolute;z-index:20;pointer-events:none;white-space:normal}
.mk .tr>.tip{overflow:visible;white-space:normal;text-overflow:clip}

/* ======================================================================================================
   FULL: the Moon Road. Night sky over water, gilt brass, display headings, banners, glows, generous air.
   ====================================================================================================== */
.mk.full{--railw:64px;--treew:292px;--detw:404px;--pane-pad:10px;--gap:12px;--treeh:34px;--rowh:34px;--gcol:38px;--stripew:3px}
.mk.full .win{border-color:#4A4130;box-shadow:inset 0 0 0 1px rgba(217,190,130,.10),0 0 0 1px rgba(0,0,0,.7),0 24px 60px rgba(0,0,0,.65),0 6px 16px rgba(0,0,0,.4)}
/* sky over water: indigo zenith, a faint horizon of moonlight at 58 %, darker water under it */
.mk.full .w-body{background:linear-gradient(180deg,#1B2552 0%,#151D44 18%,#10162E 46%,#0F1424 66%,#111833 88%,#141C3A 100%)}
.mk.full .rail{background:linear-gradient(180deg,rgba(6,8,18,.92),rgba(8,11,22,.86));border-right-color:rgba(168,139,82,.28)}
.mk.full .rail .rule{width:40px;height:1px;background:linear-gradient(90deg,rgba(168,139,82,0),rgba(217,190,130,.9),rgba(168,139,82,0));margin-bottom:8px}
.mk.full .rail .thread{position:absolute;left:6px;top:62px;height:270px;width:1px;background:linear-gradient(rgba(168,139,82,0),rgba(168,139,82,.45) 12%,rgba(168,139,82,.45) 88%,rgba(168,139,82,0))}
.mk.full .st.on svg{color:var(--moon);filter:drop-shadow(0 0 6px rgba(242,210,122,.45))}
.mk.full .st.on::before{content:"";position:absolute;left:5px;top:14px;bottom:14px;width:3px;border-radius:2px;background:linear-gradient(var(--moonhi),var(--moondeep));box-shadow:0 0 8px rgba(242,210,122,.45)}
.mk.full .st.on::after{content:"";position:absolute;left:3.5px;top:10px;width:6px;height:6px;border-radius:50%;background:var(--moonhi);box-shadow:0 0 6px rgba(255,240,190,.7)}
.mk.full .tree{background:transparent;border-right-color:rgba(168,139,82,.22)}
.mk.full .th{display:flex;align-items:center;gap:9px;padding:4px 6px 4px;margin-bottom:4px}
.mk.full .th .sig{width:10px;height:10px;flex:none}
.mk.full .th b{font:600 13px/1 "Barlow Condensed","Noto Sans",sans-serif;letter-spacing:.2em;color:var(--gilthi);text-transform:uppercase}
.mk.full .th .r{flex:1;height:1px;background:linear-gradient(90deg,rgba(217,190,130,.75),rgba(168,139,82,0))}
.mk.full .th span{font-size:10.5px;color:var(--dusk)}
.mk.full .tn .road{position:absolute;left:34px;right:8px;bottom:2px;height:1px;background:linear-gradient(90deg,rgba(168,139,82,.30),rgba(168,139,82,0) 85%)}
.mk.full .tn.sel{background:linear-gradient(90deg,rgba(242,210,122,.16),rgba(242,210,122,.04))}
.mk.full .tn.sel::before{box-shadow:0 0 6px rgba(242,210,122,.6)}
.mk.full .tn .orb{width:22px;height:22px}
/* the moon-road divider: a brass rule fading both ways, a lozenge of light where the road meets the horizon */
.mk.full .mrd{display:flex;align-items:center;gap:8px;height:14px;margin:4px 6px}
.mk.full .mrd i{flex:1;height:1px;background:linear-gradient(90deg,rgba(168,139,82,0),rgba(217,190,130,.75))}
.mk.full .mrd i+b+i{background:linear-gradient(90deg,rgba(217,190,130,.75),rgba(168,139,82,0))}
.mk.full .mrd b{width:6px;height:6px;transform:rotate(45deg);background:linear-gradient(135deg,#FFF0BE,#C9A65C 55%,#7A6236);box-shadow:0 0 6px rgba(242,210,122,.55)}
/* table: the scope's title in the display face, eyebrow header, brass rule */
.mk.full .ttl{display:flex;align-items:baseline;gap:10px;padding:12px 14px 6px}
.mk.full .ttl b{font:400 20px/1.1 Marcellus,Georgia,serif;color:var(--silver);letter-spacing:.02em;text-shadow:0 1px 0 rgba(0,0,0,.5)}
.mk.full .ttl span{font:600 12px/1 "Barlow Condensed",sans-serif;letter-spacing:.16em;color:var(--gilthi);text-transform:uppercase}
.mk.full .ttl em{margin-left:auto;font-style:normal;font-size:11px;color:var(--dusk)}
.mk.full .thd{height:26px;font:600 11.5px/1 "Barlow Condensed",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--dusk);position:relative}
.mk.full .thd .sort{color:var(--gilthi)}
.mk.full .thd::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:1px;background:linear-gradient(90deg,rgba(168,139,82,0),rgba(217,190,130,.8) 18%,rgba(168,139,82,.55) 70%,rgba(168,139,82,0))}
.mk.full .grp{height:34px;padding:8px 14px 0}
.mk.full .grp b{font:600 12.5px/1 "Barlow Condensed",sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--gilthi)}
.mk.full .grp span{font-size:11px;color:var(--dusk)}
.mk.full .grp::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(168,139,82,.55),rgba(168,139,82,0))}
.mk.full .tr{border-bottom:1px solid rgba(42,49,73,.35);font-size:13px}
.mk.full .tr:nth-child(even of .tr){background:rgba(120,140,200,.025)}
.mk.full .tr.sel{background:linear-gradient(90deg,rgba(242,210,122,.13),rgba(242,210,122,.035) 60%,rgba(242,210,122,.02));box-shadow:inset 0 1px 0 rgba(217,190,130,.35),inset 0 -1px 0 rgba(217,190,130,.35)}
.mk.full .tr.hov{background:rgba(38,45,69,.75)}
.mk.full .tr.rdy::after{content:"";position:absolute;left:38px;right:30%;bottom:-1px;height:1px;background:linear-gradient(90deg,rgba(242,210,122,.55),rgba(242,210,122,0));box-shadow:0 0 4px rgba(242,210,122,.35)}
.mk.full .tr .g img{filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.55))}
.mk.full .tr.rdy .g img{filter:drop-shadow(0 0 4px rgba(242,210,122,.45)) drop-shadow(0 1px 1px rgba(0,0,0,.5))}
/* detail */
.mk.full .det{border-left-color:rgba(168,139,82,.28);background:linear-gradient(180deg,rgba(12,16,34,.25),rgba(10,14,30,.55))}
.mk.full .det-in{padding:10px 12px 12px}
.mk.full .ban{position:relative;flex:none;height:156px;border-radius:5px;background:#1B2240;box-shadow:0 0 0 1px rgba(217,190,130,.42),0 6px 18px rgba(0,0,0,.45);margin-bottom:-6px}
/* Night grade, at draw time, in this order: multiply #2A3768 at .70 (.55 left the daylight banner at mean L 65), desaturate 35 %, scrim to Night, MoonHigh wash from the upper left. */
.mk.full .ban .art{position:absolute;inset:0;border-radius:5px;overflow:hidden;isolation:isolate;filter:saturate(.65)}
.mk.full .ban .art .img{position:absolute;inset:0;background-size:cover;background-repeat:no-repeat}
.mk.full .ban .art .mul{position:absolute;inset:0;background:#2A3768;mix-blend-mode:multiply;opacity:.70}
.mk.full .ban .scrim{position:absolute;inset:0;border-radius:5px;background:linear-gradient(180deg,rgba(15,20,36,0) 0%,rgba(15,20,36,.25) 45%,rgba(15,20,36,.85) 100%)}
.mk.full .ban .wash{position:absolute;inset:0;border-radius:5px;background:radial-gradient(90% 110% at 0 0,rgba(255,240,190,.06),rgba(255,240,190,0) 70%)}

   1. Quest-pane section headings (Requirements, Rewards, Unlocks, Moonlit, Path): the Section role.

   ====================================================================================================== */
.mk.full.v7 .card h4{margin:0 0 10px;font:500 18px/1 "Barlow Condensed","Noto Sans",sans-serif;letter-spacing:.08em;color:#E6CF98;text-shadow:0 1px 0 rgba(0,0,0,.55)}
.mk.full.v7 .card h4 .r{font:500 11.5px/1 "Noto Sans",sans-serif;letter-spacing:0;color:var(--mist);text-shadow:none}
.mk.full.v7 .card h4 .r.ec{color:var(--etext)}
.mk.quiet.v7 .card h4{margin:0 0 8px;font:500 15px/1.2 "Noto Sans",sans-serif;color:var(--silver)}
.mk.quiet.v7 .card h4 .r{font-size:11.5px;color:var(--mist)}
.mk.quiet.v7 .card h4 .r.ec,.mk.plain.v7 .ps span.ec{color:var(--etext)}
.mk.plain.v7 .ps{height:22px;align-items:center;margin:6px -8px 2px;padding:0 8px;background:var(--p-band);font:500 12.5px/1 "Noto Sans",sans-serif;color:var(--silver);border-bottom:1px solid var(--p-line)}
.mk.plain .ps span.ec{color:var(--etext)}
/* 1.13 Plain drew these headings in the disabled tone (ImGui.TextDisabled) */
.mk.plain:not(.v7) .ps{color:var(--dusk);font-weight:500}

/* Quest pane content for the owner's quest (Blue Collar Work) */
.mk .req .ico{width:14px;flex:none;display:flex;justify-content:center}
.mk .req .ico svg{width:11px;height:11px}
.mk .req.nx .lab{color:var(--moon)}
.mk.full .req.nx::before{content:"";position:absolute;left:-14px;top:4px;bottom:4px;width:2px;border-radius:1px;background:var(--moon);box-shadow:0 0 5px rgba(242,210,122,.6)}
.mk.quiet .req.nx::before{content:"";position:absolute;left:-11px;top:4px;bottom:4px;width:2px;background:var(--moon)}
.mk .req .d.ec{color:var(--etext)}
.mk .lvbar{display:flex;align-items:center;gap:8px;margin:0 0 4px 22px;font-size:10.5px;color:var(--dusk)}
.mk .lvbar i{flex:none;width:120px;height:4px;border-radius:2px;background:rgba(74,82,112,.5);position:relative;overflow:hidden;margin-left:auto}
.mk .lvbar i::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10%;background:var(--eclipse)}
.mk .rwline{font-size:12.5px;color:var(--silver)}
.mk .unl .sub{font-size:11px;color:var(--mist);margin-bottom:6px}
.mk .unl .it{display:flex;align-items:center;gap:12px}
.mk .unl .it .ai{width:44px;height:44px;border-radius:6px;flex:none;position:relative;overflow:hidden;
  background:radial-gradient(70% 60% at 60% 30%,#E8E4F2 0,#9AA2C8 18%,rgba(70,40,90,0) 40%),linear-gradient(160deg,#5A2235,#B23A3A 45%,#3A1420);box-shadow:0 0 0 1px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.12)}
.mk .unl .it .ai::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0) 40%)}
.mk .unl .it b{display:block;font-weight:500;font-size:12.5px;color:var(--silver)}
.mk .unl .it span{font-size:11.5px;color:#7FA3E6}
.mk .mlt{font-size:12px;color:var(--dusk)}
.mk.plain .unl .it .ai{width:32px;height:32px;border-radius:3px}
/* The Path card (PathChart): a band per expansion, the thread, nodes; stars only in the band's empty sky */
.mk .path{position:relative;margin:0 -4px}
.mk .path .sky{position:absolute;left:0;top:0;width:100%;height:100%}
.mk .pband{position:relative;z-index:1;display:flex;align-items:center;gap:8px;height:22px;padding-left:24px;font:600 11.5px/1 "Barlow Condensed",sans-serif;letter-spacing:.16em;color:var(--mist);text-transform:uppercase}
.mk .pband::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(168,139,82,.5),rgba(168,139,82,0))}
.mk .pband .sg{width:9px;height:9px;position:absolute;left:12px}
.mk .prow{position:relative;z-index:1;display:flex;align-items:center;gap:10px;height:30px;padding-left:6px;font-size:12.5px;white-space:nowrap}
.mk .prow .nd{width:24px;height:24px;flex:none;display:flex;align-items:center;justify-content:center;position:relative}
.mk .prow .nd img{width:20px;height:20px}
.mk .prow.cur{background:linear-gradient(90deg,rgba(221,227,240,.08),rgba(221,227,240,.02));border-radius:4px}
.mk .prow.cur .nd img{width:26px;height:26px}
.mk .prow.cur .nd::before{content:"";position:absolute;inset:-4px;border-radius:50%;box-shadow:0 0 0 1.5px rgba(217,190,130,.75)}
.mk .prow.cur b{font-weight:600}
.mk .prow .x{color:var(--etext);font-size:12px}
.mk .prow .dn{color:var(--dusk);font-size:11.5px}
.mk .prow .bd3{width:8px;height:20px;border-radius:4px;background:#1C2237;box-shadow:inset 0 0 0 1px #3A4260;margin:0 8px;position:relative}
.mk .prow .bd3::before{content:"";position:absolute;left:3px;top:4px;width:2px;height:12px;background:repeating-linear-gradient(#C9A65C 0 2px,transparent 2px 5px)}
.mk .pnext{position:relative;z-index:1;height:20px;padding-left:40px;font:600 11px/20px "Barlow Condensed",sans-serif;letter-spacing:.14em;color:var(--dusk);text-transform:uppercase}
.mk .path .thr{position:absolute;z-index:0;left:17.5px;top:24px;bottom:12px;width:1px;background:linear-gradient(rgba(168,139,82,.0),rgba(168,139,82,.45) 10%,rgba(168,139,82,.45) 90%,rgba(168,139,82,0))}
.mk.quiet .pband,.mk.plain .pband{font:600 11.5px/1 "Noto Sans",sans-serif;letter-spacing:0;text-transform:none}
.mk.quiet .pband::after,.mk.plain .pband::after{background:var(--line)}
.mk.quiet .path .thr,.mk.plain .path .thr{background:var(--line)}
.mk.quiet .pnext,.mk.plain .pnext{font:500 11px/20px "Noto Sans",sans-serif;letter-spacing:0;text-transform:none}
.mk.quiet .prow.cur .nd::before{box-shadow:0 0 0 1px #8A93B0}
.mk.plain .prow{height:22px;font-size:12px}
.mk.plain .prow .nd{width:14px;height:14px}
.mk.plain .prow .nd::before{display:none}
.mk.plain .prow.cur{background:rgba(221,227,240,.09);border-radius:0}
/* the detail pane scrolled (as the owner's screenshot is), with ImGui's scrollbar */
.mk .det-sc{position:relative;display:flex;flex-direction:column;gap:var(--gap)}
.mk .vsb{position:absolute;z-index:3;right:2px;width:6px;border-radius:3px;background:rgba(124,134,168,.38)}
.mk.plain .vsb{border-radius:0;width:5px}

/* ======================================================================================================
   5. Journal column headers, a step larger by default.
   Full: Eyebrow at 1.62x body (was 1.45x), TextSecondary (was Tertiary), header 30 px (was 26).
   Quiet: the body size (was Caption 0.85x), TextSecondary, 28 px. Plain: the body size on a 22 px band (was 20).
   ====================================================================================================== */
.mk.full.v7 .thd{height:30px;font:500 13.5px/1 "Barlow Condensed",sans-serif;letter-spacing:.12em;color:var(--mist)}
.mk.full.v7 .thd .sort{color:#E6CF98}
.mk.quiet.v7 .thd{height:28px;font-size:12.5px;color:var(--mist)}
.mk.plain.v7 .thd{height:22px;font-size:12px;color:var(--mist)}

/* ======================================================================================================
   6. The rail. No thread, no lit bar: a station plate, a larger icon, the label at 0.78x, and a moon bead that travels.
   ====================================================================================================== */
.mk .r7 .sts{width:100%;display:flex;flex-direction:column;position:relative}
.mk .st7{position:relative;width:100%;height:var(--sth);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer}
.mk .st7 .pl{position:absolute;left:5px;right:5px;top:3px;bottom:3px;border-radius:10px;opacity:0;transition:opacity .18s cubic-bezier(.215,.61,.355,1)}
.mk .st7 .gl{position:absolute;left:50%;top:calc(50% - 8px);width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;opacity:0;background:radial-gradient(closest-side,rgba(242,210,122,.16),rgba(242,210,122,.05) 60%,rgba(242,210,122,0));transition:opacity .15s}
.mk .st7 .ic{position:relative;width:var(--ici);height:var(--ici);color:var(--dusk);opacity:.72;transition:transform .18s cubic-bezier(.215,.61,.355,1),opacity .18s,color .15s}
.mk .st7 .ic svg,.mk .st7 .ic .orb{width:100%;height:100%;display:block}
.mk .st7 .lb{position:relative;font-size:11px;line-height:1;color:var(--mist);transition:color .18s;white-space:nowrap}
.mk .st7 .bd{position:absolute;top:-5px;right:-11px;min-width:17px;height:15px;padding:0 4px;border-radius:8px;background:var(--moon);color:#1A1406;font-size:9.5px;font-weight:600;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1.5px #0B0F1C}
.mk .st7:hover .ic,.mk .st7.hov .ic{transform:translateY(-2px);opacity:.95;transition-duration:.12s}
.mk .st7:hover .pl,.mk .st7.hov .pl{opacity:.55;transition-duration:.12s}
.mk .st7:hover .lb,.mk .st7.hov .lb{color:var(--silver)}
.mk .st7.half .ic{transform:translateY(-1.3px);opacity:.88}
.mk .st7.half .pl{opacity:.36}
.mk .st7.on .ic{opacity:1;transform:none}
.mk .st7.on .lb{color:var(--silver)}
.mk .r7 .bead{position:absolute;z-index:3;left:1px;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;transition:top .22s cubic-bezier(.645,.045,.355,1)}
/* Full */
.mk.full .r7{--sth:72px;--ici:30px}
.mk.full .st7 .pl{background:#262D45}
.mk.full .st7.on .pl{opacity:1;background:linear-gradient(180deg,rgba(242,210,122,.11),rgba(242,210,122,.03));box-shadow:inset 0 0 0 1px rgba(217,190,130,.26),inset 0 1px 0 rgba(255,240,190,.10)}
.mk.full .st7.on .gl{opacity:1}
.mk.full .st7.on .ic{color:var(--moon);filter:drop-shadow(0 0 6px rgba(242,210,122,.42))}
.mk.full .r7 .bead{background:radial-gradient(circle at 40% 35%,#FFFDF2,#FFF0BE 55%,#E9CF86);box-shadow:0 0 0 1.5px #080B16,0 0 7px rgba(255,240,190,.7)}
/* Quiet: flat plate, the bead without its glow */
.mk.quiet .r7{--sth:66px;--ici:28px}
.mk.quiet .st7 .pl{background:#1C2338}
.mk.quiet .st7.on .pl{opacity:1;background:rgba(221,227,240,.06);box-shadow:inset 0 0 0 1px #3A4260}
.mk.quiet .st7.on .ic{color:var(--moon)}
.mk.quiet .st7:hover .ic,.mk.quiet .st7.hov .ic{transform:translateY(-1px)}
.mk.quiet .st7.half .ic{transform:translateY(-.6px)}
.mk.quiet .r7 .bead{left:1.5px;width:5px;height:5px;margin-top:-2.5px;background:var(--moon)}
/* Plain: compact icons only, a flat band and a 2 px bar, nothing moves */
.mk.plain .r7{--sth:46px;--ici:20px}
.mk.plain .st7 .lb,.mk.plain .st7 .gl,.mk.plain .r7 .bead{display:none}
.mk.plain .st7 .pl{left:0;right:0;top:0;bottom:0;border-radius:0;background:#1D2230}
.mk.plain .st7.on .pl{opacity:1;background:var(--p-band)}
.mk.plain .st7.on::before{content:"";position:absolute;z-index:2;left:0;top:0;bottom:0;width:2px;background:var(--silver)}
.mk.plain .st7.on .ic{color:var(--silver)}
.mk.plain .st7 .ic{opacity:.8}
.mk.plain .st7:hover .ic,.mk.plain .st7.hov .ic{transform:none}
.mk.plain .st7 .bd{top:-4px;right:-9px;min-width:0;height:auto;padding:0;background:transparent;color:var(--mist);font-size:9px;box-shadow:none}

/* ======================================================================================================
   3. The sky (Full only): shooting star on a completion
   ====================================================================================================== */
@keyframes mk-shoot{0%{transform:translate(0,0);opacity:0}8%{opacity:1}100%{transform:translate(64px,34px);opacity:0}}
.mk .shooting{position:absolute;z-index:2;pointer-events:none;opacity:0;width:46px;height:2px;transform-origin:100% 50%}
.mk .shooting i{position:absolute;inset:0;transform:rotate(28deg);transform-origin:100% 50%;background:linear-gradient(90deg,rgba(255,240,190,0),rgba(255,240,190,.45));border-radius:1px}
.mk .shooting i::after{content:"";position:absolute;right:-1px;top:-1px;width:4px;height:4px;border-radius:50%;background:rgba(255,248,226,.8);box-shadow:0 0 5px rgba(255,240,190,.6)}
.mk .shooting.go{animation:mk-shoot .7s cubic-bezier(.215,.61,.355,1) both}

/* ======================================================================================================
   2. The filter drawer. Over the tree column exactly (no overlap onto the list), sized to its content, a clean edge.
   ====================================================================================================== */
.mk .tree .lay{transition:opacity .16s}
.mk.v7.dopen .tree .lay{opacity:0}
.mk .drw{position:absolute;z-index:30;left:var(--railw);top:0;width:calc(var(--treew) + 1px);max-height:100%;display:flex;flex-direction:column;animation:mk-fade .16s both}
@keyframes mk-fade{from{opacity:0}to{opacity:1}}
.mk .drw .dh{flex:none;display:flex;align-items:center;gap:9px}
.mk .drw .dic{flex:none;display:flex;align-items:center;justify-content:center}
.mk .drw .dic svg{width:13px;height:13px}
.mk .drw .dct{display:inline-flex;align-items:center;white-space:nowrap}
.mk .drw .dsp{flex:1}
.mk .drw .dib{flex:none;display:flex;align-items:center;justify-content:center;color:var(--mist)}
.mk .drw .dib svg{width:11px;height:11px}
.mk .drw .dsc{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}
.mk .drw .dsec h5{margin:0;display:flex;align-items:center;gap:8px;white-space:nowrap}
.mk .drw .dsec h5 .cv{display:inline-block;transition:transform .14s;font-size:9px;color:var(--dusk);width:10px}
.mk .drw .dsec.open h5 .cv{transform:rotate(90deg)}
.mk .drw .dsec h5 .pc{margin-left:auto;font:500 11px/1 "Noto Sans",sans-serif;letter-spacing:0;text-transform:none;padding:3px 8px;border-radius:9px}
.mk .drw .trow{display:flex;align-items:center;gap:10px}
.mk .drw .trow .tl{flex:1;min-width:0}
.mk .drw .trow .tl>span{display:block;color:var(--silver)}
.mk .drw .trow .tl>em{display:block;font-style:normal;color:var(--dusk);margin-top:1px}
.mk .drw .trow .tl>em u{text-decoration:none;color:var(--mist)}
.mk .drw .trow.dis .tl,.mk .drw .trow.dis .tg{opacity:.45}
.mk .drw .tg{position:relative;flex:none;width:36px;height:20px;border-radius:10px;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line)}
.mk .drw .tg::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--mist);transition:left .15s}
.mk .drw .tg.on{background:#635940;box-shadow:inset 0 0 0 1px var(--moon)}
.mk .drw .tg.on::after{left:19px;background:radial-gradient(circle 5.7px at calc(50% - 3.9px) calc(50% - 2.5px),#635940 97%,rgba(99,89,64,0) 100%),#FFF0BE}
.mk .drw .stp{flex:none;display:flex;align-items:center;height:28px;border-radius:14px;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line)}
.mk .drw .stp i{width:22px;height:22px;margin:3px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;color:var(--mist);background:#1E2337;font-size:13px;line-height:1}
.mk .drw .stp span{min-width:54px;text-align:center;font-size:12.5px;color:var(--silver);font-variant-numeric:tabular-nums}
.mk .drw .sum .sr{display:flex;align-items:center;gap:8px;white-space:nowrap}
.mk .drw .sum .sr .k{flex:1;color:var(--mist)}
.mk .drw .sum .sr .v{color:var(--silver);overflow:hidden;text-overflow:ellipsis;max-width:150px}
.mk .drw .sum .sr .v.set{color:var(--moonhi)}
.mk .drw .sum .sr .v.set::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--moon);margin:0 6px 1px 0;vertical-align:middle}
.mk .drw .sum .sr .ch{color:var(--veil);font-size:12px}
.mk .drw .gp{margin-top:12px}
.mk .drw .gp .gh{display:flex;align-items:baseline;gap:8px;margin:0 0 7px;font-size:12px;color:var(--silver);font-weight:500}
.mk .drw .gp .gh span{margin-left:auto;font-weight:500;font-size:11px;color:var(--dusk)}
.mk .drw .gp .gh span.set{color:var(--moonhi)}
.mk .drw .sch{display:flex;flex-wrap:wrap;gap:5px}
.mk .drw .sc{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px 0 5px;border-radius:13px;font-size:11.5px;white-space:nowrap;border:1px solid var(--line);background:var(--sunk);color:var(--mist)}
.mk .drw .sc img,.mk .drw .sc svg{width:16px;height:16px;flex:none}
.mk .drw .sc.on{color:var(--silver);background:linear-gradient(#262D47,#1E2439);border-color:rgba(124,134,168,.55)}
.mk .drw .sc.off{border-style:dashed;color:var(--dusk)}
.mk .drw .sc.off img,.mk .drw .sc.off svg{opacity:.38;filter:grayscale(.6)}
.mk .drw .sgm{display:flex;height:26px;border-radius:13px;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.mk .drw .sgm span{flex:1;display:flex;align-items:center;justify-content:center;font-size:11.5px;color:var(--mist);border-right:1px solid var(--line);white-space:nowrap}
.mk .drw .sgm span:last-child{border-right:0}
.mk .drw .sgm span.on{background:rgba(221,227,240,.10);color:var(--silver)}
.mk .drw .dd{display:flex;align-items:center;height:28px;border-radius:14px;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line);padding:0 12px;font-size:12.5px;color:var(--silver)}
.mk .drw .dd i{margin-left:auto;font-style:normal;color:var(--dusk);font-size:10px}
.mk .drw .rng{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dusk)}
.mk .drw .rng .f{flex:1;height:28px;border-radius:14px;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;justify-content:center;color:var(--silver);font-size:12.5px;font-variant-numeric:tabular-nums}
.mk .drw .rtr{position:relative;height:4px;border-radius:2px;background:rgba(74,82,112,.45);margin:9px 6px 2px}
.mk .drw .rtr i{position:absolute;top:0;bottom:0;border-radius:2px}
.mk .drw .rwr{display:flex;align-items:center;gap:10px;height:30px;font-size:12.5px;color:var(--silver)}
.mk .drw .rwr .k{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mk .drw .rwr .sgm{flex:none;width:126px;height:22px;border-radius:11px}
.mk .drw .rwr .sgm span{font-size:11px}
.mk .drw .more{font-size:11.5px;color:var(--mist);margin-top:4px}
.mk .drw .dft{flex:none;display:flex;align-items:center;gap:8px;white-space:nowrap;position:relative}
.mk .drw .dft .sh{color:var(--mist)}
.mk .drw .dft .sh b{color:var(--silver);font-weight:600;font-variant-numeric:tabular-nums}
.mk .drw .rst{margin-left:auto;display:inline-flex;align-items:center;gap:6px;color:var(--mist);cursor:pointer}
.mk .drw .rst svg{width:12px;height:12px}
.mk .drw .rst:hover{color:var(--silver)}
.mk .drw .rst.off{color:var(--veil)}
.mk .drw .sbar{position:absolute;right:3px;width:5px;border-radius:3px;background:rgba(124,134,168,.42)}

/* Full: a gilt sheet, lit from the upper left, with a brass edge on the two sides that face the list */
.mk.full .drw{border:solid transparent;border-width:0 1px 1px 0;border-radius:0 0 6px 0;
  background:linear-gradient(180deg,rgba(33,39,66,.995),rgba(23,28,47,.995)) padding-box,linear-gradient(172deg,#E2C78C 0%,#A88B52 26%,#6E5732 64%,#5A4729 100%) border-box;
  box-shadow:0 14px 30px rgba(0,0,0,.55),8px 0 18px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,240,190,.06)}
.mk.full .drw .cmk{position:absolute;right:-1.5px;bottom:-1.5px;width:9px;height:9px;border:0 solid #B79755;border-right-width:1.5px;border-bottom-width:1.5px;border-radius:0 0 5px 0}
.mk.full .drw .dh{height:52px;padding:0 10px 0 13px}
.mk.full .drw .dic{width:28px;height:28px;border-radius:50%;color:var(--moonhi);background:radial-gradient(circle at 38% 32%,#2D3560,#141A31 75%);box-shadow:inset 0 0 0 1px rgba(217,190,130,.6),0 1px 3px rgba(0,0,0,.55)}
.mk.full .drw .dh b{font:400 19px/1 Marcellus,Georgia,serif;letter-spacing:.02em;color:#F4F1E8;text-shadow:0 1px 0 rgba(0,0,0,.5)}
.mk.full .drw .dct{height:19px;padding:0 8px;border-radius:10px;font-size:11px;background:linear-gradient(rgba(242,210,122,.18),rgba(242,210,122,.08));border:1px solid rgba(242,210,122,.45);color:var(--moonhi)}
.mk.full .drw .dib{width:26px;height:26px;border-radius:50%;background:linear-gradient(180deg,#252B45,#1C2138);border:1px solid var(--line)}
.mk.full .drw .dib.on{color:var(--moon);border-color:rgba(242,210,122,.5);background:rgba(242,210,122,.10)}
.mk.full .drw>.mrd{margin:0 12px}
.mk.full .drw .dsc{padding:2px 14px 10px}
.mk.full .drw .dsec{margin-top:12px}
.mk.full .drw .dsec h5{height:30px;font:500 18px/1 "Barlow Condensed",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#E6CF98;text-shadow:0 1px 0 rgba(0,0,0,.55)}
.mk.full .drw .dsec h5::after{content:"";flex:1;height:1px;order:2;background:linear-gradient(90deg,rgba(217,190,130,.6),rgba(168,139,82,0))}
.mk.full .drw .dsec h5 .pc{order:3;background:rgba(242,210,122,.12);border:1px solid rgba(242,210,122,.35);color:var(--moonhi)}
.mk.full .drw .dsec h5 .cv{order:0;color:#D9BE82}
.mk.full .drw .trow{min-height:36px;padding:3px 0}
.mk.full .drw .trow .tl>span{font-size:13px}
.mk.full .drw .trow .tl>em{font-size:11px}
.mk.full .drw .sum{margin-top:4px}
.mk.full .drw .sum .sr{height:30px;padding:0 8px;margin:0 -8px;border-radius:6px;font-size:12.5px;border-bottom:1px solid rgba(42,49,73,.45)}
.mk.full .drw .sum .sr:last-child{border-bottom:0}
.mk.full .drw .sum .sr:hover,.mk.full .drw .sum .sr.hov{background:rgba(38,45,69,.65)}
.mk.full .drw .dft{height:48px;padding:0 10px 0 14px;font-size:12px}
.mk.full .drw .dft::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,rgba(168,139,82,.15),rgba(217,190,130,.7) 50%,rgba(168,139,82,.15))}
.mk.full .drw .rst{height:28px;padding:0 11px;border-radius:14px;font-size:12px}
.mk.full .drw .rst:hover,.mk.full .drw .rst.hov{background:rgba(38,45,69,.8)}

/* Quiet: a flat sheet one tone up, a neutral hairline edge, a separation shadow only */
.mk.quiet .drw{background:#1A2135;border-right:1px solid #2E3650;border-bottom:1px solid #2E3650;border-radius:0 0 6px 0;box-shadow:0 8px 20px rgba(0,0,0,.45)}
.mk.quiet .drw .dh{height:46px;padding:0 8px 0 12px}
.mk.quiet .drw .dic{width:16px;color:var(--mist)}
.mk.quiet .drw .dh b{font:500 15px/1 "Noto Sans",sans-serif;color:var(--silver)}
.mk.quiet .drw .dct{height:18px;padding:0 7px;border-radius:9px;font-size:11px;background:#262D42;color:var(--silver)}
.mk.quiet .drw .dib{width:26px;height:26px;border-radius:50%;border:1px solid #2E3650}
.mk.quiet .drw .dib.on{color:var(--silver);background:rgba(221,227,240,.08)}
.mk.quiet .drw>.hr{height:1px;background:#262D42;margin:0}
.mk.quiet .drw .dsc{padding:2px 12px 8px}
.mk.quiet .drw .dsec{margin-top:10px}
.mk.quiet .drw .dsec h5{height:28px;font:500 15px/1 "Noto Sans",sans-serif;color:var(--silver)}
.mk.quiet .drw .dsec h5 .pc{background:#262D42;color:var(--silver)}
.mk.quiet .drw .trow{min-height:34px;padding:2px 0}
.mk.quiet .drw .trow .tl>span{font-size:12.5px}
.mk.quiet .drw .trow .tl>em{font-size:11px}
.mk.quiet .drw .tg.on{background:#4A4F5C;box-shadow:inset 0 0 0 1px rgba(221,227,240,.55)}
.mk.quiet .drw .tg.on::after{background:radial-gradient(circle 5.7px at calc(50% - 3.9px) calc(50% - 2.5px),#4A4F5C 97%,rgba(74,79,92,0) 100%),#DDE3F0}
.mk.quiet .drw .sum .sr{height:28px;padding:0 6px;margin:0 -6px;border-radius:5px;font-size:12.5px}
.mk.quiet .drw .sum .sr:hover,.mk.quiet .drw .sum .sr.hov{background:#222A40}
.mk.quiet .drw .sum .sr .v.set{color:var(--silver)}
.mk.quiet .drw .sum .sr .v.set::before{background:var(--silver)}
.mk.quiet .drw .gp .gh span.set{color:var(--silver)}
.mk.quiet .drw .sc.on{background:#262D42;border-color:#3A4260}
.mk.quiet .drw .dft{height:42px;padding:0 8px 0 12px;font-size:12px;border-top:1px solid #262D42}
.mk.quiet .drw .rst{height:26px;padding:0 10px;border-radius:13px;font-size:12px}
.mk.quiet .drw .rst:hover,.mk.quiet .drw .rst.hov{background:#222A40}

/* Plain: a ledger sheet. Bands, 24 px rows, checkboxes, no light at all */
.mk.plain .drw{background:#151A25;border-right:1px solid #303648;border-bottom:1px solid #303648;font-size:12px}
.mk.plain .drw .dh{height:26px;padding:0 3px 0 8px;gap:6px;background:var(--p-band);border-bottom:1px solid var(--p-line)}
.mk.plain .drw .dic{display:none}
.mk.plain .drw .dh b{font:500 12.5px/1 "Noto Sans",sans-serif;color:var(--silver)}
.mk.plain .drw .dct{font-size:11px;color:var(--mist)}
.mk.plain .drw .dib{width:20px;height:20px;border-radius:3px;border:1px solid var(--p-line)}
.mk.plain .drw .dib.on{color:var(--silver);background:#202634}
.mk.plain .drw .dsc{padding:0 8px 4px}
.mk.plain .drw .dsec h5{height:20px;margin:0 -8px 2px;padding:0 8px;background:var(--p-band);border-bottom:1px solid var(--p-line);border-top:1px solid var(--p-line);font:500 12px/1 "Noto Sans",sans-serif;color:var(--silver)}
.mk.plain .drw .dsec:first-child h5{border-top:0}
.mk.plain .drw .dsec h5 .pc{padding:0;color:var(--mist)}
.mk.plain .drw .dsec h5 .cv{color:var(--mist)}
.mk.plain .drw .trow{min-height:24px;gap:6px}
.mk.plain .drw .trow.tgl{flex-direction:row-reverse;justify-content:flex-end}
.mk.plain .drw .trow .tl>span{display:inline;font-size:12px}
.mk.plain .drw .trow .tl>em{display:inline;margin-left:6px;font-size:11px}
.mk.plain .drw .tg{width:14px;height:14px;border-radius:2px;background:#202634;box-shadow:inset 0 0 0 1px #3A4050}
.mk.plain .drw .tg::after{display:none}
.mk.plain .drw .tg.on{background:#202634;box-shadow:inset 0 0 0 1px #4A5270}
.mk.plain .drw .tg.on::before{content:"";position:absolute;left:4.5px;top:1.5px;width:3.5px;height:7.5px;border:solid var(--silver);border-width:0 1.6px 1.6px 0;transform:rotate(42deg)}
.mk.plain .drw .stp{height:20px;border-radius:2px}
.mk.plain .drw .stp i{width:18px;height:16px;margin:2px;border-radius:2px;background:#202634}
.mk.plain .drw .stp span{min-width:46px;font-size:12px}
.mk.plain .drw .sum .sr{height:22px;padding:0 4px;margin:0 -4px;font-size:12px}
.mk.plain .drw .sum .sr:nth-child(even){background:rgba(255,255,255,.022)}
.mk.plain .drw .sum .sr .v.set{color:var(--silver)}
.mk.plain .drw .sum .sr .v.set::before{display:none}
.mk.plain .drw .sum .sr .v.set::after{content:" *";color:var(--moon)}
.mk.plain .drw .gp{margin-top:6px}
.mk.plain .drw .gp .gh{margin-bottom:4px;font-size:11.5px;color:var(--mist)}
.mk.plain .drw .sc{height:20px;border-radius:2px;padding:0 6px 0 3px;font-size:11.5px;gap:4px}
.mk.plain .drw .sc img,.mk.plain .drw .sc svg{width:12px;height:12px}
.mk.plain .drw .sc.on{background:#202634;border-color:#3A4050}
.mk.plain .drw .sgm,.mk.plain .drw .dd,.mk.plain .drw .rng .f{height:20px;border-radius:2px;font-size:11.5px}
.mk.plain .drw .rwr{height:22px;font-size:12px}
.mk.plain .drw .rwr .sgm{height:18px;border-radius:2px;width:112px}
.mk.plain .drw .rtr{display:none}
.mk.plain .drw .dft{height:24px;padding:0 6px 0 8px;font-size:11.5px;background:#0D1018;border-top:1px solid var(--p-line)}
.mk.plain .drw .rst{font-size:11.5px;text-decoration:underline;text-decoration-color:var(--veil);text-underline-offset:2px}
.mk.plain .drw .rst svg{display:none}

/* 1.13 as shipped (owner-filter-menu.png): a full-height grey panel 300 px wide, ImGui defaults, the tree's header and
   counts painting through it. Reproduced for the before panels only. */
.mk .drw13{position:absolute;z-index:30;left:var(--railw);top:0;bottom:0;width:300px;background:#1E2437;border-right:1px solid #2A3149;box-shadow:10px 0 10px -6px rgba(0,0,0,.22);padding:6px 8px;font:500 12.5px/1.2 "Noto Sans",sans-serif;color:#C9CFDF}
.mk .drw13 .h{display:flex;align-items:center;height:22px;color:#A0A9C2;font-size:12.5px}
.mk .drw13 .h .ib{margin-left:auto;display:flex;gap:12px;color:#A0A9C2}
.mk .drw13 .h .ib svg{width:12px;height:12px}
.mk .drw13 .dis{color:#7C86A8;margin:4px 0 4px}
.mk .drw13 .ln{display:flex;align-items:center;gap:6px;height:24px}
.mk .drw13 .sl{width:94px;height:20px;background:#0B0F1C;border-radius:3px;display:flex;align-items:center;justify-content:center;position:relative;font-size:12px}
.mk .drw13 .sl::before{content:"";position:absolute;left:3px;top:3px;width:10px;height:14px;border-radius:2px;background:#5C6584}
.mk .drw13 .cb{width:19px;height:19px;border-radius:3px;background:#0B0F1C;flex:none;position:relative}
.mk .drw13 .cb.on::before{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg)}
.mk .drw13 .sb{padding:2px 5px;background:transparent;color:#C9CFDF;font-size:12px}
.mk .drw13 .sep{height:1px;background:#2A3149;margin:4px 0}
.mk .drw13 .adv{display:flex;align-items:center;gap:8px;height:22px;background:#2A3149;border-radius:3px;padding-left:6px;margin-top:2px}
.mk .drw13 .adv::before{content:"";border-left:7px solid #C9CFDF;border-top:4.5px solid transparent;border-bottom:4.5px solid transparent;margin-right:4px}
.mk.b13open .tree .lay{z-index:auto}
.mk.b13open .tree .th{position:relative;z-index:31}
.mk.b13open .tree .tn .ct{position:relative;z-index:31;clip-path:inset(0 0 0 78%)}
.mk.b13open .tree .tn.sel::before{z-index:31}

/* ======================================================================================================
   Boards (the renders): rail states, the drawer set, the sky, before / after
   ====================================================================================================== */
.board{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.board h2{margin:0;font:400 18px/1.2 Marcellus,Georgia,serif;color:#F4F1E8;letter-spacing:.01em}
.board h2 small{font:500 12px/1.3 "Noto Sans",sans-serif;color:#7C86A8;margin-left:10px;letter-spacing:0}
.board .row{display:flex;gap:16px;align-items:flex-start}
.board figure{margin:0;display:flex;flex-direction:column;gap:7px}
.board figcaption{font-size:12px;color:#A9B2CC;line-height:1.35;max-width:100%}
.board figcaption b{color:#FFF0BE;font-weight:600}
.board figcaption i{font-style:normal;color:#7C86A8}
.crop{position:relative;overflow:hidden;border-radius:7px;box-shadow:0 0 0 1px #232A42,0 14px 30px rgba(0,0,0,.5);flex:none}
.crop>.mk{position:absolute;left:0;top:0}
.crop>.mk .win{border-radius:0}
.spec{background:rgba(10,14,27,.82);border:1px solid #232A42;border-radius:8px;padding:10px 12px;font-size:12px;color:#A9B2CC;line-height:1.45}
.spec b{color:#DDE3F0;font-weight:600}
.spec table{border-collapse:collapse;width:100%}
.spec td,.spec th{padding:3px 8px 3px 0;text-align:left;vertical-align:top;border-bottom:1px solid #1A2033}
.spec th{color:#D9BE82;font:600 11.5px/1.2 "Barlow Condensed",sans-serif;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.tile{position:relative;overflow:hidden;border-radius:7px;box-shadow:0 0 0 1px #232A42}
.tile .lbl{position:absolute;left:10px;top:8px;z-index:3;font-size:11px;color:#A9B2CC;text-shadow:0 1px 2px #000}
.tile .lbl b{color:#FFF0BE;font-weight:600}

/* 1.13's Full rail as the code draws it (the v13 mock drew the thread at the edge): segments between the stations */
.mk.full:not(.v7) .rail .thread,.mk.full:not(.v7) .st.on::before,.mk.full:not(.v7) .st.on::after{display:none}
.mk .th13{position:absolute;left:calc(50% - .5px);width:1px;background:rgba(168,139,82,.55)}
.mk .lit13{position:absolute;left:calc(50% - 1px);width:2px;border-radius:1px;background:linear-gradient(#FFF0BE,#D6B25A);box-shadow:0 0 5px rgba(242,210,122,.45)}
.mk .bead13{position:absolute;left:calc(50% - 3px);width:6px;height:6px;border-radius:50%;background:#FFF0BE;box-shadow:0 0 0 1.5px #0B0F1C}

/* ======================================================================================================
   Review round 1 (supervisor-review.md, critic.md)
   ====================================================================================================== */
/* Heading hierarchy: the quest title stays the largest text in the pane (caps at least 1.2x the Section caps) */
.mk.full.v7 .ban .t .n{font-size:23px}
.mk.quiet.v7 .qh .n{font-size:18.5px}
.mk.plain.v7 .ph .n{font-size:15px}
/* Column headers at 1.55x, +0.08 em: never larger than the group headers */
.mk.full.v7 .thd{font-size:12.5px;letter-spacing:.08em}
/* Drawer at Full: no icon disc, neutral pills, the Advanced rule in OrnamentLight, set values in Text with a MoonHigh dot,
   and an unoffset contact shadow on the list side instead of the sideways one */
.mk.full .drw{box-shadow:0 14px 30px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,240,190,.06)}
.mk.full .drw::after{content:"";position:absolute;top:0;bottom:6px;right:-15px;width:14px;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.30),rgba(0,0,0,0))}
.mk.full .drw .dic{width:16px;height:auto;border-radius:0;background:none;box-shadow:none;color:var(--moonhi)}
.mk.full .drw .dct,.mk.full .drw .dsec h5 .pc{background:#262D42;border:0;color:var(--silver)}
.mk.full .drw .dsec h5::after{background:linear-gradient(90deg,rgba(230,207,152,.55),rgba(230,207,152,0))}
.mk.full .drw .sum .sr .v.set,.mk.full .drw .gp .gh span.set{color:var(--silver)}
.mk.full .drw .sum .sr .v.set::before{background:var(--moonhi)}
/* Rail at Full: the selected station keeps the plate, the gold icon and the bead; no glow, hairline or border.
   A hovered plate gets a 1 px darker bottom edge, so the 2 px rise has a cause. */
.mk.full .st7 .pl{box-shadow:inset 0 -1px 0 rgba(0,0,0,.38)}
.mk.full .st7.on .pl{background:rgba(242,210,122,.07);box-shadow:none}
.mk.full .st7.on .gl{opacity:0}
.mk.full .st7.on .ic{filter:none}

/* ======================================================================================================
   Revision 3 (owner notes after approval)
   ====================================================================================================== */
/* Rail labels: the rail is 70 (Full) / 66 (Quiet) so every English label fits its plate at 12 px; the plate insets 3 px;
   the fit pass (fitLabels) tracks or shrinks a label that still does not fit, and never lets it leave the plate. */
.mk.full.v7{--railw:70px}
.mk.quiet.v7{--railw:66px}
.mk .st7 .pl{left:3px;right:3px}
.mk.full .st7 .lb,.mk.quiet .st7 .lb{font-size:12px;max-width:none;text-align:center;line-height:1.05}
.mk .st7.iconly .lb{display:none}
/* The Journal badge: one fixed size that never shrinks (16 px tall, 10 px semibold), 1-2 digits; "99+" is not expected */
.mk .st7 .bd{top:-5px;right:-12px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;font-size:10px;font-weight:600;line-height:16px}
.mk .st7 .bd.w2{right:-16px}
.mk .st .bd.b13{top:3px;right:6px;min-width:0;height:12px;padding:0 3px;font-size:7px;line-height:12px;border-radius:6px}
.mk.plain .st7 .bd{background:transparent;color:var(--moon);font-size:10px;box-shadow:none;right:-10px}
.tipx{background:linear-gradient(180deg,rgba(26,31,52,.97),rgba(17,21,38,.97));border:1px solid #6E5732;border-radius:4px;padding:9px 11px;color:#A9B2CC;font-size:12px;line-height:1.5}
.tipx b{color:#DDE3F0}
.tipx i{color:#7C86A8;font-style:normal}
/* The moving sky: one rigid drift, wrapping (keyframes take the tile width from --dw) */
@keyframes mk-drift{from{transform:translateX(0)}to{transform:translateX(var(--dw))}}
.mk .drift{animation:mk-drift linear infinite}
@keyframes mk-shoot-faint{0%{transform:translate(0,0);opacity:0}8%{opacity:.45}100%{transform:translate(64px,34px);opacity:0}}
.mk .shooting.faint.go{animation:mk-shoot-faint .7s cubic-bezier(.215,.61,.355,1) both}
/* The badge keeps full strength on an idle station: the idle dimming applies to the icon, not to its badge */
.mk .st7 .ic,.mk .st7.half .ic,.mk .st7:hover .ic,.mk .st7.hov .ic{opacity:1}
.mk .st7 .ic>svg{opacity:.72;transition:opacity .18s}
.mk .st7.half .ic>svg{opacity:.88}
.mk .st7:hover .ic>svg,.mk .st7.hov .ic>svg{opacity:.95;transition-duration:.12s}
.mk .st7.on .ic>svg{opacity:1}
.mk.plain .st7 .ic>svg{opacity:.8}

/* ======================================================================================================
   1.15 "Faces and icons" (spec-1.15.md)
   ====================================================================================================== */
.b15 .row{flex-wrap:wrap}
.b15 .mk{flex:none}
.mk .pp{display:block;flex:none;overflow:visible}
@keyframes pp-fade{from{opacity:0}to{opacity:1}}
.mk .pp.fade{animation:pp-fade .3s cubic-bezier(.215,.61,.355,1) both}
/* Giver card */
.mk.gcard{width:390px}
.mk.gcard .card{padding-bottom:13px}
.mk .gv{display:flex;align-items:center;gap:14px}
.mk .gv .gt{display:flex;flex-direction:column;gap:3px;min-width:0}
.mk .gv .gt b{font-weight:500;font-size:13.5px;color:var(--silver)}
.mk .gv .gt span{font-size:12px;color:var(--mist)}
.mk.quiet .gv{gap:12px}
.mk.gcard-p{width:330px;background:var(--night);padding:6px 8px;border:1px solid #2A2F3D}
.mk.gcard-p .kv dd{gap:6px}
.mk.gcard-p .pp{width:18px;height:18px}
.rawg{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:11px;color:#7C86A8}
.rawg .ar{color:#A9B2CC;font-size:14px}
.rawg i{font-style:normal;margin-left:6px}
.fades{display:flex;gap:10px;background:#141B33;padding:10px;border-radius:6px}
.fadecap{display:flex;gap:10px;padding:0 10px}
.fadecap span{width:72px;text-align:center;font-size:11px;color:#7C86A8}
/* Tooltip at 128 */
.mk .tip.t15{position:relative;left:auto;top:auto;width:200px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 14px 12px;text-align:center}
.mk .tip.t15 b{margin-top:6px}
.mk .tip.t15 p{margin:0}
.mk .tip.t15 .src{color:var(--dusk);font-size:11px}
/* Avatars */
.mk .card.c15{width:390px}
.mk .stp15,.mk .rt{display:flex;align-items:center;gap:10px;height:40px;border-bottom:1px solid rgba(42,49,73,.45)}
.mk .stp15:last-child,.mk .rt:last-child{border-bottom:0}
.mk .stp15 .st,.mk .rt .st{display:flex;flex-direction:column;min-width:0;flex:1}
.mk .stp15 .st b,.mk .rt .st b{font-weight:500;font-size:12.5px;color:var(--silver)}
.mk .stp15 .st span,.mk .rt .st span{font-size:11px;color:var(--mist)}
.mk .stp15 .sic{display:flex}
.mk .rt .n{width:18px;height:18px;border-radius:50%;background:#1C2237;box-shadow:inset 0 0 0 1px #3A4260;color:var(--mist);font-size:10.5px;display:flex;align-items:center;justify-content:center;flex:none}
.mk .jt15 .jr{display:flex;align-items:center;gap:9px;height:30px;font-size:12.5px;color:var(--silver);border-bottom:1px solid rgba(42,49,73,.35)}
.mk .jt15 .jr img{width:18px;height:18px}
/* Crop boxes */
.cropbox{position:relative;background:#141B33;border-radius:4px;overflow:hidden}
.cropbox img{display:block}
.cropbox i{position:absolute;border:1.5px solid #F2D27A;box-shadow:0 0 0 999px rgba(5,7,13,.45);border-radius:50%}
/* Fallbacks */
.silgrid{display:grid;grid-template-columns:repeat(9,110px);gap:12px 10px}
.silgrid .sg{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px;background:#0F1424;border:1px solid #232A42;border-radius:8px;padding:12px 6px 8px}
.silgrid .sg figcaption{font-size:11px;color:#A9B2CC;text-align:center}
.silgrid .sg figcaption b{color:#DDE3F0;display:block}
.frow{display:flex;gap:14px;align-items:center;background:#0F1424;border:1px solid #232A42;border-radius:8px;padding:12px 14px}
.frow.sz{gap:12px}
/* Game icons in buttons */
.mk .gi{display:block;flex:none}
.mk .gi.tile{border-radius:3px;box-shadow:0 0 0 1px rgba(8,11,22,.5)}
.mk .gi.marker{filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
.mk .p15{display:inline-flex;align-items:center;white-space:nowrap;flex:none}
.mk .p15.full{height:30px;border-radius:15px;gap:6px;padding:0 13px 0 11px;background:linear-gradient(180deg,#252B45,#1C2138);border:1px solid rgba(168,139,82,.6);color:var(--silver);font-size:12px;box-shadow:inset 0 1px 0 rgba(255,240,190,.06)}
.mk .p15.full.pri{background:linear-gradient(180deg,#FFE6A3,#F2D27A 45%,#D9B65F);border-color:#F6DFA0;color:#1A1406;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 0 14px rgba(242,210,122,.30),0 2px 4px rgba(0,0,0,.4)}
.mk .p15.quiet{height:28px;border-radius:14px;gap:6px;padding:0 12px 0 10px;background:var(--q-card,#1F273C);border:1px solid #2E3650;color:var(--silver);font-size:12px}
.mk .p15.quiet.pri{background:var(--moon);border-color:var(--moon);color:#1A1406}
.mk .p15.plain{height:22px;border-radius:3px;gap:4px;padding:0 8px 0 7px;background:#202634;border:1px solid #303648;color:var(--silver);font-size:11.5px}
.mk .p15.plain.pri{color:var(--moon);border-color:#4A4636}
.mk .p15.io{justify-content:center;padding:0}
.mk .p15.full.io{width:44px}.mk .p15.quiet.io{width:41px}.mk .p15.plain.io{width:32px}
.mk .bar15{display:flex;gap:6px;flex-wrap:nowrap;overflow:hidden;padding:4px 0}
.mk .rb15{display:flex;gap:6px;margin-top:6px}
.mk .rb15 .rb{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--mist)}
.mk .rb15 .rb.full{background:linear-gradient(180deg,#252B45,#1C2138);border:1px solid var(--line)}
.mk .rb15 .rb.quiet{border:1px solid #2E3650}
.mk .rb15 .rb.plain{width:22px;height:22px;border-radius:3px;border:1px solid var(--p-line,#262B38)}
.mk .rb15 .rb svg{width:13px;height:13px}
.mk .inst{width:16px;height:16px;border-radius:3px;background:#DDE3F0;color:#11151F;font:700 11px/16px "Noto Sans",sans-serif;text-align:center}
/* Route window */
.mk .route15{width:470px;background:linear-gradient(180deg,rgba(26,31,52,.97),rgba(17,21,38,.97));border:1px solid #4A4130;border-radius:6px;padding:10px 12px}
.mk .route15 .rh{display:flex;align-items:center;gap:10px;padding:2px 2px 10px;border-bottom:1px solid rgba(168,139,82,.4);margin-bottom:6px}
.mk .route15 .rh b{font:400 17px/1.2 Marcellus,Georgia,serif;color:#F4F1E8}
.mk .route15 .rh span{margin-left:auto;font-size:11.5px;color:var(--mist)}
.mk .route15 .rr{display:flex;align-items:center;gap:10px;height:40px}
.mk .route15 .rr .n{width:18px;height:18px;border-radius:50%;background:#1C2237;box-shadow:inset 0 0 0 1px #3A4260;color:var(--mist);font-size:10.5px;display:flex;align-items:center;justify-content:center;flex:none}
.mk .route15 .rr .m{font-size:11.5px;color:var(--dusk)}
/* In-game panel */
.mk .igp{width:420px;background:rgba(14,18,34,.92);border:1px solid #3A3426;border-radius:6px;padding:10px 12px}
.mk .igp .igh{font:400 15px/1.2 Marcellus,Georgia,serif;color:#F4F1E8;margin-bottom:8px}
.mk .igp .igr{display:flex;gap:6px}
.mk .igp .p15.full{height:26px;font-size:11.5px;padding:0 11px 0 9px}
.mk .igp .p15 .gi{width:16px;height:16px}
/* Requirements with icons */
.mk .card.c15 .rq{display:flex;align-items:center;gap:8px;min-height:26px;font-size:12.5px}
.mk .card.c15 .rq>svg{width:11px;height:11px;flex:none}
.mk .card.c15 .rq .l{color:var(--silver)}
.mk .card.c15 .rq .d{margin-left:auto;font-size:11.5px;color:var(--mist)}
.mk .card.c15 .rq .d.ec{color:var(--etext)}
.mk .card.c15 .rwi{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--silver)}
.mk .card.c15 .rwi span{margin-right:10px}
.b15 .spec code{font-size:11px;color:#DDE3F0}
.b15 .spec td img{display:inline-block;vertical-align:middle}
.mk .stp15 .st,.mk .rt .st{align-items:flex-start;text-align:left}
.mk .jt15 .jr .qn{width:150px;color:var(--mist)}
.mk .jt15 .jr .gn{color:var(--silver)}
.fades>div{width:72px}
.fadecap span{width:72px}
.cs15{display:flex;gap:12px;flex-wrap:wrap;background:#0F1424;border:1px solid #232A42;border-radius:8px;padding:12px}
.cs15 figure{margin:0;display:flex;flex-direction:column;gap:6px;width:150px}
.cs15 .gd{position:relative;width:120px;height:120px}
.cs15 .gd .gb{position:absolute;inset:0;width:120px;height:120px;pointer-events:none}
.cs15 figcaption{font-size:11px;color:#A9B2CC;line-height:1.35}
.cs15 figcaption b{color:#DDE3F0}
.cs15 figcaption i{font-style:normal;color:#7C86A8}
.mk .rb15 .rb.bk svg{width:14px;height:14px}
.cs15 figure.k128{width:auto}
.cs15 .kr{display:flex;gap:10px}

    var h = '<div class="pv16" style="background:' + ink.bg + ";color:" + ink.t + ";border-color:" + ink.ln + '"><div class="pvh" style="color:' + ink.t2 + '">' + (hovering ? "Previewing: <b style=\"color:" + ink.t + "\">" + T.name + "</b><span>In use: Menphina's Medallion</span>" : "Preview · <b style=\"color:" + ink.t + "\">" + T.name + "</b>") + "</div>";
    h += '<div class="pvb"><div class="pvr">' + rows.map(function (r) { return '<div class="r16" style="border-color:' + ink.ln + '">' + (T.k === "classic" ? classicGlyph(r[0], 18) : '<img src="' + T.dir + r[0] + '.svg" width="18" height="18">') + "<span>" + r[1] + '</span><em><b style="color:' + col(r[0]) + '">' + r[2] + '</b> <i style="color:' + ink.t2 + '">· ' + r[3] + "</i></em></div>"; }).join("") + "</div>";
    h += '<div class="pvc" style="background:' + ink.r + ";border-color:" + ink.ln + '">' + hero + '<div><h5 style="color:' + ink.h + '">In journal</h5><div style="color:' + ink.t2 + '">Dawntrail · step 4 of 6</div></div></div></div></div>';
    return h;
  }
  function seg16(items, on) { return '<div class="sg16">' + items.map(function (x, i) { return '<span class="' + (i === on ? "on" : "") + '">' + x + "</span>"; }).join("") + "</div>"; }
  function palChip(k, name, on, later) {
    var P = PSW[k] || ["#2A2F3D", "#3A4050", "#DDE3F0", "#F2D27A"];
    var sky = k === "snow" ? "linear-gradient(180deg,#D3DEF0,#EEF1F6)" : k === "dawn" ? "linear-gradient(180deg,#3A2746,#1A1526)" : k === "kugane" ? "linear-gradient(180deg,#2A1613,#16100F)" : k === "dalamud" ? "linear-gradient(135deg,#2B2B2B,#1E1E1E)" : "linear-gradient(180deg,#1B2552,#0F1424)";
    return '<div class="pk' + (on ? " on" : "") + (later ? " later" : "") + '"><div class="pkm" style="background:' + sky + '"><i style="background:' + P[1] + '"></i><i style="background:' + P[1] + ';width:60%"></i><b style="background:' + P[3] + '"></b><em style="background:' + P[2] + '"></em></div><span>' + name + (later ? " <i>1.17</i>" : "") + "</span></div>";
  }
  function settingsPage(v) {
    // v: "1.16" or "1.17"; hover: which card is hovered (preview swaps to it)
    var later = v === "1.17", hov = later ? null : "glass";
    var nav = ["General", "Themes", "Journal", "Travel", "In-game panels", "Overlay", "Alerts", "Companions", "Data", "Advanced"];
    var h = '<div class="mk full v7 set16" style="height:' + (later ? 1760 : 1330) + 'px"><div class="win"><div class="w-title"><span class="tri"></span>Tsukimichi Settings<span class="wc">' + ICON.x + '</span></div><div class="sbody"><nav class="snav"><div class="ssearch">' + ICON.search + "<span>Search settings</span></div>" +
      nav.map(function (n) { return '<div class="sn' + (n === "Themes" ? " on" : "") + '">' + n + "</div>"; }).join("") + '</nav><div class="spage">';
    h += '<div class="sh16"><h3>Themes</h3><p>Moons, frames and colours. Hover a theme to preview it; click to use it.</p></div>';
    h += '<section><h4>Theme</h4><div class="tgrid">' + THEMES.filter(function (T) { return (later || !T.later) && !(T.later && !T.dir); }).map(function (T) { return themeCard(T, T.def ? "on" : T.k === hov ? "hov" : ""); }).join("") + "</div></section>";
    h += '<section><h4>Preview</h4>' + previewPanel(hov ? THEMES[1] : THEMES[0], !!hov) + "</section>";
    h += '<section><h4>Colours</h4><div class="srow"><div class="sl"><b>Palette</b><span>Window, text and sky colours. Moons keep their own.</span></div><div class="pks">' +
      palChip("night", "Night", true) + palChip("snow", "Ishgard Snow") + (later ? palChip("dawn", "Dawn") + palChip("kugane", "Kugane Lacquer") : "") + palChip("dalamud", "Follow Dalamud") + "</div></div>";
    h += '<div class="srow"><div class="sl"><b>High contrast</b><span>One set of moons made for low vision, on every theme. Your theme\'s moons return when it is off.</span></div><span class="tg16"></span></div>';
    h += '<div class="srow"><div class="sl"><b>Frames</b><span>The metal round each moon and card.</span></div>' + seg16(["From theme", "Brass", "Silver", "Came"].concat(later ? ["Astrolabe", "Kirikane"] : []), 0) + "</div></section>";
    if (later) {
      h += '<section class="new17"><h4>Mix moons by state <span class="nb">1.17</span></h4><div class="mixt">' + ST8.map(function (s, i) {
        var nm = { "ready": "Ready", "ready-on-another-job": "Ready on another job", "in-journal": "In journal", "blocked": "Blocked", "done-this-cycle": "Done this cycle", "completed": "Completed", "locked-out": "Locked out", "not-checked": "Not checked" }[s];
        var pick = i === 1 ? ["aether", "Aether Crystal"] : i === 5 ? ["glass", "Ishgard Glass"] : null;
        var src = pick ? (pick[0] === "glass" ? TH + "ishgard-glass/" : TH + "aether-crystal/") : "../../moon-v6/round5/medallion-r5/";
        return '<div class="mx"><span class="mn">' + nm + '</span><img src="' + src + (s === "ready-on-another-job" ? "ready-on-another-job-paladin" : s) + '.svg" width="32" height="32"><span class="dd16">' + (pick ? pick[1] : "From theme") + '<i>▾</i></span>' + (i === 1 ? '<span class="nt">close to Blocked in a list</span>' : "<span></span>") + "</div>";
      }).join("") + '</div><div class="mixs"><span>1 pair of moons is close in a list.</span><span class="qa">Fix it</span><span class="qa">Reset mix</span></div></section>';
      h += '<section class="new17"><h4>Share <span class="nb">1.17</span></h4><div class="srow"><div class="sl"><b>Share code</b><span>Ids only; paste one to preview what changes before applying.</span></div><div class="shr"><code>TM1-7Q4K-2XH8-M3D1</code><span class="qa">Copy</span><span class="pin16">Paste a code</span><span class="qa">Apply</span></div></div></section>';
    }
    h += '<section><div class="srow rst"><div class="sl"><b>Reset appearance</b><span>' + (later ? "Hold to reset while a mix is set; Undo follows either way." : "Back to Menphina's Medallion on Night. Undo follows.") + '</span></div><span class="qa rs">' + ICON.reset + (later ? "Hold to reset" : "Reset appearance") + "</span></div></section>";
    h += "</div></div>" + (later ? "" : '<div class="toast16">Theme: Ishgard Glass<span class="u">Undo</span></div>') + "</div></div>";
    return h;
  }
  function boardThemes() {
    return '<div class="board b15 b16"><h2>1.16 · Settings › Themes<small>Left: the page as 1.16 ships it, the Ishgard Glass card hovered and previewed. Right: the same page in 1.17 with the Orrery (Sumi to Kinpaku stays hidden until its art is approved), two more palettes, Mix by state and Share: the same column, the same widths; sections are added below Frames, nothing above moves.</small></h2>' +
      '<div class="row" style="align-items:flex-start">' + fig(settingsPage("1.16"), "<b>1.16</b>") + fig(settingsPage("1.17"), "<b>1.17</b> (mix-and-match; no redesign)") + "</div></div>";
  }
  // ---------- Page ----------
  var host = document.getElementById("host"), seg = document.getElementById("seg"), ver = document.getElementById("ver"), pn = document.getElementById("pn");
  function show(hash) {
    var parts = hash.split("/"), v = parts[0], w = parts[1] || "";
    if (!NOTE[v]) v = "full";
    seg.querySelectorAll("button").forEach(function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-v") === v ? "true" : "false"); });
    ver.style.display = v === "full" || v === "quiet" || v === "plain" ? "" : "none";
    ver.querySelectorAll("button").forEach(function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-w") === w ? "true" : "false"); });
    pn.textContent = NOTE[v];
    if (v === "drawer") host.innerHTML = boardDrawer();
    else if (v === "rail") host.innerHTML = boardRail();
    else if (v === "stars") host.innerHTML = boardStars();
    else if (v === "ba") host.innerHTML = boardBA();
    else if (v === "snow-full") host.innerHTML = snowWin("full");
    else if (v === "snow-full-drawer") host.innerHTML = snowWin("full", { drawer: "c", dopt: { hovRow: 1 } });
    else if (v === "snow-quiet") host.innerHTML = snowWin("quiet", { drawer: "c" });
    else if (v === "snow-plain") host.innerHTML = snowWin("plain", { drawer: "e", dopt: { to: "adv" } });
    else if (v === "palettes") { host.innerHTML = boardPalettes(); renderContrast(); }
    else if (v === "themes") host.innerHTML = boardThemes();
    else if (v === "giver") host.innerHTML = boardGiver();
    else if (v === "fallbacks") host.innerHTML = boardFallbacks();
    else if (v === "buttons") host.innerHTML = boardButtons();
    else if (v === "sky") host.innerHTML = win("full", { v7: true, h: 790 });
    else host.innerHTML = win(v, { v7: w !== "before", drawer: w === "open" ? "c" : w === "open-adv" ? "e" : null, h: 790 });
    // Expanded drawers on the boards open scrolled to the Advanced section (as after a click on its summary).
    fitLabels(host);
    fitLadders(host);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { fitLabels(host); fitLadders(host); labelTable(); });
    function toAdvanced() {
      host.querySelectorAll(".dsc-in[data-to=adv]").forEach(function (el) {
        var t = el.querySelectorAll(".dsec")[2], pad = parseFloat(getComputedStyle(el.parentNode).paddingTop) || 0;
        if (t) el.style.transform = "translateY(-" + Math.max(0, t.offsetTop - pad) + "px)";
      });
    }
    toAdvanced();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(toAdvanced);
    V7 = true;
  }
  seg.addEventListener("click", function (e) { var b = e.target.closest("button"); if (b) location.hash = b.getAttribute("data-v"); });
  ver.addEventListener("click", function (e) { var b = e.target.closest("button"); if (b) { var v = location.hash.slice(1).split("/")[0] || "full", w = b.getAttribute("data-w"); location.hash = v + (w ? "/" + w : ""); } });
  host.addEventListener("click", function (e) {
    var st = e.target.closest(".st7");
    if (st && st.closest(".r7")) {
      var rail = st.closest(".r7"), all = rail.querySelectorAll(".st7"), bead = rail.querySelector(".bead"), k = Array.prototype.indexOf.call(all, st);
      all.forEach(function (s) { s.classList.toggle("on", s === st); });
      if (bead) bead.style.top = ((k + 0.5) * st.offsetHeight - (st.closest(".plain") ? 0 : 8)).toFixed(1) + "px";
      return;
    }
    if (e.target.closest("[data-act=filters]")) { var p = location.hash.slice(1).split("/"); location.hash = (p[0] || "full") + (p[1] === "open" || p[1] === "open-adv" ? "" : "/open"); return; }
    var dh = e.target.closest(".dsec h5");
    if (dh && dh.querySelector(".cv")) { var p2 = location.hash.slice(1).split("/"); location.hash = (p2[0] || "full") + (p2[1] === "open-adv" ? "/open" : "/open-adv"); }
  });
  document.getElementById("shoot").addEventListener("click", function () {
    var m = host.querySelector(".mk.full .shooting");
    if (!m || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    m.classList.remove("go"); void m.offsetWidth; m.classList.add("go");
  });
  // The moving sky: x1 is the real speed (6 px a minute); x30 previews it. It pauses while this page is unfocused.
  var K = 1;
  function setSpeed() {
    host.querySelectorAll(".drift").forEach(function (d) { d.style.animationDuration = (parseFloat(d.getAttribute("data-w")) / DRIFT_PX_PER_MIN * 60 / K).toFixed(1) + "s"; });
    var b = document.getElementById("spd"); if (b) b.textContent = K === 1 ? "Sky speed: x1" : "Sky speed: x30 (preview)";
  }
  document.getElementById("spd").addEventListener("click", function () { K = K === 1 ? 30 : 1; setSpeed(); });
  function pause(p) {
    host.querySelectorAll(".drift").forEach(function (d) { d.style.animationPlayState = p ? "paused" : "running"; });
    host.querySelectorAll("svg.sky").forEach(function (sv) { if (sv.pauseAnimations) { if (p) sv.pauseAnimations(); else sv.unpauseAnimations(); } });
  }
  window.addEventListener("blur", function () { pause(true); });
  window.addEventListener("focus", function () { pause(false); });
  // A rare faint meteor at rest: every 3 to 6 minutes of focused time (Full, Reduce motion off).
  (function ambient() {
    setTimeout(function () {
      var m = host.querySelector(".mk.full .shooting.faint");
      if (m && document.hasFocus() && !matchMedia("(prefers-reduced-motion: reduce)").matches) { m.classList.remove("go"); void m.offsetWidth; m.classList.add("go"); }
      ambient();
    }, (180 + Math.random() * 180) * 1000 / K);
  })();
  window.addEventListener("hashchange", function () { show(location.hash.slice(1)); setSpeed(); });
  show(location.hash.slice(1) || "full");
})();
