<svg xmlns="http://www.w3.org/2000/svg" width="480" height="24" viewBox="0 0 240 12">
<title>divider-moonroad (2x)</title>
<desc>Moon-road divider: a hairline that fades in and out, broken by three phases (waxing, full, waning). Between the sections of a pane; drawn with primitives at runtime, this file is the reference. Original Tsukimichi art; rasterize into assets/ui/ornaments@2x.png.</desc>
<defs><linearGradient id="l" x1="0" x2="1"><stop offset="0" stop-color="#A88B52" stop-opacity="0"/><stop offset="1" stop-color="#A88B52" stop-opacity=".8"/></linearGradient>
<linearGradient id="r" x1="0" x2="1"><stop offset="0" stop-color="#A88B52" stop-opacity=".8"/><stop offset="1" stop-color="#A88B52" stop-opacity="0"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF0BE"/><stop offset=".45" stop-color="#F2D27A"/><stop offset="1" stop-color="#D6B25A"/></linearGradient>
<mask id="wax"><rect width="240" height="12" fill="#fff"/><circle cx="106.2" cy="6" r="2.4" fill="#000"/></mask>
<mask id="wan"><rect width="240" height="12" fill="#fff"/><circle cx="133.8" cy="6" r="2.4" fill="#000"/></mask></defs>
<rect x="0" y="5.5" width="100" height="1" fill="url(#l)"/>
<rect x="140" y="5.5" width="100" height="1" fill="url(#r)"/>
<circle cx="108" cy="6" r="2.6" fill="#D9BE82" mask="url(#wax)"/>
<circle cx="120" cy="6" r="3.4" fill="url(#gold)"/>
<circle cx="132" cy="6" r="2.6" fill="#D9BE82" mask="url(#wan)"/>
</svg>
