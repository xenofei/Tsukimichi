<title>Tsukimichi Plan 9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600&text=%E6%9C%88%E3%81%AE%E9%81%93&display=swap">
<style>
/* Layout: a widescreen review desk under a night-sea masthead. The masthead carries the release "moon road";
   below it three panes: release rail · proposal board · feedback pane. Narrow screens fold the pane into a drawer. */
:root{
  --ground:#0A0F1D; --sky:#141D38; --surface:#10172A; --raised:#161F38; --sunk:#0C1222;
  --line:#253051; --line-soft:#1A2340;
  --ink:#ECE7D9; --ink-2:#B0B7CC; --ink-3:#7D87A5;
  --gilt:#D2B26C; --gilt-strong:#EFD9A0; --gilt-soft:rgba(210,178,108,.16);
  --aether:#8ACBEA; --aether-soft:rgba(138,203,234,.13);
  --moon:#EEE8D8; --moon-shade:#1D2745; --moon-line:rgba(238,232,216,.35);
  --yes:#8FCFA8; --maybe:#E2B867; --no:#E2867A;
  --yes-soft:rgba(143,207,168,.16); --maybe-soft:rgba(226,184,103,.16); --no-soft:rgba(226,134,122,.16);
  --shadow:0 18px 40px -24px rgba(0,0,0,.85);
  --f-display:"Marcellus","Trajan Pro",Georgia,serif;
  --f-body:"Hanken Grotesk","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --f-jp:"Shippori Mincho","Yu Mincho","Hiragino Mincho ProN",serif;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --ground:#E8ECF3; --sky:#D7E0EF; --surface:#F6F8FB; --raised:#FFFFFF; --sunk:#EEF1F6;
    --line:#C9D2E2; --line-soft:#DCE2EC;
    --ink:#131A2C; --ink-2:#434E69; --ink-3:#69728D;
    --gilt:#8A6824; --gilt-strong:#6A4E14; --gilt-soft:rgba(138,104,36,.12);
    --aether:#1C6A98; --aether-soft:rgba(28,106,152,.10);
    --moon:#FFFDF6; --moon-shade:#CBD3E3; --moon-line:rgba(19,26,44,.35);
    --yes:#2C7A4D; --maybe:#94660E; --no:#B1443A;
    --yes-soft:rgba(44,122,77,.12); --maybe-soft:rgba(148,102,14,.12); --no-soft:rgba(177,68,58,.11);
    --shadow:0 18px 40px -26px rgba(30,40,70,.45);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --ground:#E8ECF3; --sky:#D7E0EF; --surface:#F6F8FB; --raised:#FFFFFF; --sunk:#EEF1F6;
  --line:#C9D2E2; --line-soft:#DCE2EC;
  --ink:#131A2C; --ink-2:#434E69; --ink-3:#69728D;
  --gilt:#8A6824; --gilt-strong:#6A4E14; --gilt-soft:rgba(138,104,36,.12);
  --aether:#1C6A98; --aether-soft:rgba(28,106,152,.10);
  --moon:#FFFDF6; --moon-shade:#CBD3E3; --moon-line:rgba(19,26,44,.35);
  --yes:#2C7A4D; --maybe:#94660E; --no:#B1443A;
  --yes-soft:rgba(44,122,77,.12); --maybe-soft:rgba(148,102,14,.12); --no-soft:rgba(177,68,58,.11);
  --shadow:0 18px 40px -26px rgba(30,40,70,.45);
  color-scheme:light;
}

*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--ground);color:var(--ink)}
body{font:15px/1.55 var(--f-body);padding-inline:clamp(16px,2vw,40px);padding-block:0 48px;-webkit-font-smoothing:antialiased}
a{color:var(--aether)}
code{font:500 .86em var(--f-mono);background:var(--sunk);border:1px solid var(--line-soft);padding:.05em .35em;border-radius:4px;color:var(--ink)}
strong{color:var(--ink);font-weight:600}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--aether);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance;margin:0}
.wrap{max-width:2400px;margin-inline:auto}

/* ── Masthead ───────────────────────────── */
.mast{position:relative;margin-inline:calc(-1 * clamp(16px,2vw,40px));padding:28px clamp(16px,2vw,40px) 0;
  background:linear-gradient(180deg,var(--sky),var(--ground) 92%);border-bottom:1px solid var(--line-soft)}
.mast-in{max-width:2400px;margin-inline:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:24px 48px;align-items:end}
.brand{display:flex;gap:20px;align-items:flex-start;min-width:0;padding-bottom:22px}
.kanji{font:600 15px/1.15 var(--f-jp);writing-mode:vertical-rl;letter-spacing:.3em;color:var(--gilt);border-left:1px solid var(--gilt-soft);padding-left:12px;margin-top:4px}
.eyebrow{font:500 11px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.brand h1{font:400 clamp(28px,2.6vw,44px)/1.08 var(--f-display);letter-spacing:.01em;margin-top:10px}
.brand-meta{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-top:14px;color:var(--ink-2);font-size:13.5px}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:12.5px;white-space:nowrap}
.pill.proposed{border-color:var(--gilt);color:var(--gilt-strong);background:var(--gilt-soft)}
.pill.proposed::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gilt)}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;margin:16px 0 0;padding:0}
.stats div{display:flex;flex-direction:column}
.stats dt{font:500 10.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);order:2;margin-top:5px}
.stats dd{margin:0;font:600 22px/1 var(--f-body);letter-spacing:-.01em;font-variant-numeric:tabular-nums}

/* Release road */
.road{position:relative;min-width:0;overflow-x:auto;padding-bottom:18px;scrollbar-width:thin}
.road-track{--n:6;position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(96px,1fr)) minmax(112px,1fr);min-width:calc(var(--n) * 96px + 112px)}
.road-track::before{content:"";position:absolute;left:28px;right:calc(100% / (var(--n) + 1) + 10px);top:27px;height:1px;
  background:linear-gradient(90deg,transparent,var(--gilt) 12%,var(--gilt) 88%,transparent)}
.station{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;background:none;border:0;padding:6px 10px 10px;border-radius:10px;cursor:pointer;color:var(--ink-2);transition:background .18s var(--ease)}
.station:hover{background:var(--gilt-soft)}
.station .moonwrap{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:var(--ground);box-shadow:0 0 0 6px var(--ground)}
.station.par .moonwrap{background:transparent;box-shadow:none}
.station .sv{font:500 12.5px/1 var(--f-mono);color:var(--ink);letter-spacing:.04em}
.station .s-st{font-size:12.5px;line-height:1.3;max-width:14ch}
.station .sc{font:500 10.5px/1 var(--f-mono);color:var(--ink-3);letter-spacing:.06em}
.station[aria-current="true"]{background:var(--gilt-soft);color:var(--ink)}
.station[aria-current="true"] .moonwrap{box-shadow:0 0 0 6px var(--ground),0 0 0 7px var(--gilt)}
.station.par{border-left:1px dashed var(--line);border-radius:0 10px 10px 0;margin-left:6px}

/* ── Tabs bar ───────────────────────────── */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:calc(-1 * clamp(16px,2vw,40px));padding-inline:clamp(16px,2vw,40px);
  background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft)}
.bar-in{max-width:2400px;margin-inline:auto;display:flex;align-items:center;gap:16px;min-height:54px}
.s-tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tab{position:relative;background:none;border:0;padding:16px 14px;cursor:pointer;color:var(--ink-3);font-weight:500;white-space:nowrap;transition:color .15s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:2px;background:var(--gilt);border-radius:2px}
.tab .n{font:500 11px var(--f-mono);color:var(--ink-3);margin-left:6px}
.who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.who img{width:26px;height:26px;border-radius:50%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--sunk)}
.seg button{border:0;background:none;padding:4px 11px;border-radius:999px;cursor:pointer;color:var(--ink-3);font-size:12.5px;font-weight:500;transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.conn{font-size:12.5px;color:var(--ink-3);display:flex;align-items:center;gap:7px}
.conn::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.conn.live::before{background:var(--yes)}

/* ── Shell ──────────────────────────────── */
.shell{max-width:2400px;margin:26px auto 0;display:grid;grid-template-columns:280px minmax(0,1fr) clamp(400px,28vw,540px);gap:28px;align-items:start}
.shell.norail{grid-template-columns:minmax(0,1fr) clamp(400px,28vw,540px)}
.shell.norail .s-rail{display:none}
.s-rail{position:sticky;top:78px;max-height:calc(100vh - 96px);overflow:auto;scrollbar-width:thin;min-width:0}
main{min-width:0}
.pane{position:sticky;top:78px;max-height:calc(100vh - 96px);overflow:auto;scrollbar-width:thin;min-width:0;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}

/* Rail */
.s-rail h4{font:500 10.5px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px 10px}
.rail-list{display:flex;flex-direction:column;gap:2px;margin-bottom:26px}
.rl{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:none;border:0;border-radius:9px;padding:9px 10px;cursor:pointer;color:var(--ink-2);transition:background .15s}
.rl:hover{background:var(--raised)}
.rl[aria-current="true"]{background:var(--raised);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.rl b{font:500 12.5px var(--f-mono);color:var(--ink);display:block;letter-spacing:.03em}
.rl span.t{font-size:13px;line-height:1.3;display:block}
.rl .c{font:500 11px var(--f-mono);color:var(--ink-3);text-align:right}
.mine{margin:0 0 24px;padding:14px;border:1px solid var(--line-soft);border-radius:12px;background:var(--surface)}
.mine .lbl{font-size:12.5px;color:var(--ink-3)}
.mine .big{font:600 24px/1.1 var(--f-body);margin:4px 0 10px;font-variant-numeric:tabular-nums}
.meter{height:4px;border-radius:4px;background:var(--line-soft);overflow:hidden}
.meter i{display:block;height:100%;background:var(--gilt);border-radius:4px;transition:width .4s var(--ease)}
.filters{display:flex;flex-direction:column;gap:2px;margin-bottom:26px}

/* ── Main: release header + cards ──────── */
.rhead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center;margin-bottom:22px}
.rhead .ver{font:400 46px/1 var(--f-display);color:var(--gilt-strong);letter-spacing:.01em}
.rhead h2{font:400 26px/1.15 var(--f-display)}
.rhead p{margin:6px 0 0;color:var(--ink-2);max-width:80ch}
.grouphead{display:flex;align-items:baseline;gap:14px;margin:34px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line-soft)}
.grouphead:first-child{margin-top:0}
.grouphead .ver{font:400 24px/1 var(--f-display);color:var(--gilt-strong)}
.grouphead h3{font:400 18px/1.2 var(--f-display);color:var(--ink-2)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.s-card{position:relative;display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer;min-width:0;
  background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:16px 18px 14px;
  transition:border-color .18s var(--ease),transform .18s var(--ease),background .18s}
.s-card:hover{border-color:var(--line);transform:translateY(-1px)}
.s-card[aria-current="true"]{border-color:var(--gilt);background:var(--raised);box-shadow:0 0 0 3px var(--gilt-soft)}
.s-card .top{display:flex;align-items:center;gap:10px}
.iid{white-space:nowrap;font:500 12px/1 var(--f-mono);color:var(--gilt);letter-spacing:.04em;background:var(--gilt-soft);padding:4px 7px;border-radius:5px}
.eff{font-size:11.5px;color:var(--ink-3);border:1px solid var(--line-soft);border-radius:999px;padding:1px 8px}
.myv{margin-left:auto;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px}
.myv.want,.myv.good,.myv.agree,.myv.fav{color:var(--yes);background:var(--yes-soft)}
.myv.unsure,.myv.later,.myv.maybe{color:var(--maybe);background:var(--maybe-soft)}
.myv.skip,.myv.change,.myv.no{color:var(--no);background:var(--no-soft)}
.s-card h3{font:600 16.5px/1.3 var(--f-body);color:var(--ink)}
.s-card .body{color:var(--ink-2);font-size:14px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.s-card .s-foot{display:flex;align-items:center;gap:12px;margin-top:auto;padding-top:4px;font-size:12.5px;color:var(--ink-3)}
.tally{display:flex;height:5px;flex:1;max-width:160px;border-radius:5px;overflow:hidden;background:var(--line-soft)}
.tally i{display:block;height:100%}
.tally .want,.tally .good,.tally .agree,.tally .fav{background:var(--yes)}
.tally .unsure,.tally .later,.tally .maybe{background:var(--maybe)}
.tally .skip,.tally .change,.tally .no{background:var(--no)}
.cc{margin-left:auto;white-space:nowrap}
.empty{padding:40px;border:1px dashed var(--line);border-radius:12px;color:var(--ink-3);text-align:center}

/* Points */
.points{display:flex;flex-direction:column;gap:12px}
.point{display:grid;grid-template-columns:64px minmax(0,1.05fr) minmax(0,1.6fr) 200px;gap:24px;align-items:start;cursor:pointer;text-align:left;
  background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:20px 22px;transition:border-color .18s}
.point:hover{border-color:var(--line)}
.point[aria-current="true"]{border-color:var(--gilt);box-shadow:0 0 0 3px var(--gilt-soft)}
.point .num{font:400 44px/0.9 var(--f-display);color:var(--gilt)}
.point .said{font:400 19px/1.35 var(--f-display);color:var(--ink)}
.point .said::before{content:"You said";display:block;font:500 10.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
.point .plan{color:var(--ink-2);font-size:14px;line-height:1.6;min-width:0}
.point .plan::before{content:"The plan";display:block;font:500 10.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
.point .side{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.relchip{font:500 12px var(--f-mono);border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--ink);background:var(--sunk);cursor:pointer}
.relchip:hover{border-color:var(--gilt)}

/* Decisions */
.dtools{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin-bottom:18px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px}
.dec{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:18px 20px;min-width:0;transition:border-color .18s}
.dec[aria-current="true"]{border-color:var(--gilt);box-shadow:0 0 0 3px var(--gilt-soft)}
.dec .q{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;font-size:15.5px;line-height:1.45}
.dec .q .dn{font:400 30px/1 var(--f-display);color:var(--gilt)}
.dec .rec{font-size:14px;color:var(--ink-2);background:var(--sunk);border-radius:8px;padding:10px 12px;border:1px solid var(--line-soft)}
.dec .rec .lbl{font:500 10.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:6px}
.dec .row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}

/* Votes (shared control) */
.votes{display:inline-flex;gap:6px;flex-wrap:wrap}
.vbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--sunk);border-radius:9px;padding:7px 12px;cursor:pointer;font-size:13.5px;font-weight:500;color:var(--ink-2);transition:background .15s,border-color .15s,color .15s}
.vbtn:hover:not(:disabled){border-color:var(--ink-3);color:var(--ink)}
.vbtn .k{font:500 11.5px var(--f-mono);color:var(--ink-3)}
.vbtn[aria-pressed="true"].want,.vbtn[aria-pressed="true"].good,.vbtn[aria-pressed="true"].agree,.vbtn[aria-pressed="true"].fav{border-color:var(--yes);background:var(--yes-soft);color:var(--yes)}
.vbtn[aria-pressed="true"].unsure,.vbtn[aria-pressed="true"].later,.vbtn[aria-pressed="true"].maybe{border-color:var(--maybe);background:var(--maybe-soft);color:var(--maybe)}
.vbtn[aria-pressed="true"].skip,.vbtn[aria-pressed="true"].change,.vbtn[aria-pressed="true"].no{border-color:var(--no);background:var(--no-soft);color:var(--no)}
.vbtn:disabled{cursor:not-allowed;opacity:.6}
.linkbtn{background:none;border:0;padding:0;color:var(--aether);cursor:pointer;font-weight:500;font-size:13.5px}
.linkbtn:hover{text-decoration:underline}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--raised);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:13.5px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--gilt);border-color:var(--gilt);color:var(--ground)}
.btn.primary:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ── Pane ───────────────────────────────── */
.pane-in{padding:22px 24px 24px;animation:paneIn .22s var(--ease)}
@keyframes paneIn{from{opacity:.0;transform:translateY(4px)}to{opacity:1;transform:none}}
.pane .kick{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font:500 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.pane h2{font:400 26px/1.2 var(--f-display);margin:12px 0 0}
.pane .full{color:var(--ink-2);font-size:14.5px;line-height:1.65;margin-top:14px}
.pane .full p{margin:0 0 8px}
.pane .links{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:14px;font-size:13px;color:var(--ink-3)}
.pane section{border-top:1px solid var(--line-soft);margin-top:20px;padding-top:18px}
.pane h5{font:500 10.5px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin:0 0 12px;display:flex;justify-content:space-between;gap:10px}
.voters{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12.5px;color:var(--ink-3)}
.voters span{display:inline-flex;align-items:center;gap:5px}
.voters img{width:18px;height:18px;border-radius:50%}
.close{display:none}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line-soft)}
.navrow button{max-width:48%;text-align:left;background:none;border:1px solid var(--line-soft);border-radius:9px;padding:8px 11px;cursor:pointer;color:var(--ink-2);font-size:12.5px;line-height:1.35}
.navrow button:hover{border-color:var(--line);color:var(--ink)}
.navrow button b{display:block;font:500 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px}
.navrow .next{text-align:right;margin-left:auto}
.intro h2{margin-top:6px}
.intro ol{margin:14px 0 0;padding-left:20px;color:var(--ink-2);display:flex;flex-direction:column;gap:8px;font-size:14px}
.notice{font-size:13px;color:var(--ink-2);background:var(--aether-soft);border:1px solid color-mix(in srgb,var(--aether) 35%,transparent);border-radius:9px;padding:10px 12px;margin-top:14px}
.notice.warn{background:var(--maybe-soft);border-color:color-mix(in srgb,var(--maybe) 40%,transparent)}

/* Thread */
.s-thread{display:flex;flex-direction:column;gap:14px}
.note{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px}

<script>
(function(){
"use strict";
const PLAN = JSON.parse(document.getElementById("plan-data").textContent);
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS = {
  get(k, d){ try{ const v = localStorage.getItem("tsuki9:"+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("tsuki9:"+k, JSON.stringify(v)); }catch(e){} }
};

/* ── Vote scales ── */
const SCALES = {
  feature:  [["want","Build it"],["unsure","Not sure"],["skip","Skip"]],
  point:    [["good","Plan fits"],["change","Needs changes"]],
  decision: [["agree","Agree"],["change","Change"],["later","Later"]],
  design:   [["fav","Favourite"],["maybe","Maybe"],["no","Not this"]]
};
const EFFORT = {S:"Small", M:"Medium", L:"Large"};
const KIND_LABEL = {feature:"Feature", point:"Your point", decision:"Decision", design:"Design concept"};

/* ── Item registry ── */
const ITEMS = new Map(); const ORDER = { feature:[], point:[], decision:[], design:[] };
PLAN.releases.forEach(r => r.items.forEach(it => { const o = {...it, kind:"feature", relLabel: r.ver}; ITEMS.set(it.id, o); ORDER.feature.push(it.id); }));
PLAN.points.forEach(p => { ITEMS.set(p.id, {...p, kind:"point", body:p.plan}); ORDER.point.push(p.id); });
PLAN.decisions.forEach(d => { ITEMS.set(d.id, {...d, kind:"decision", body:d.rec}); ORDER.decision.push(d.id); });
((PLAN.designs && PLAN.designs.groups) || []).forEach(g => (g.items || []).forEach(c => { const id = "X-"+c.id; ITEMS.set(id, {...c, id, kind:"design", title:c.name, body:c.pitch}); ORDER.design.push(id); }));

// Point → planned feature ids (parsed from the plan text, ranges like M1–M3 expanded)
const POINT_FEATURES = {}; const FEATURE_POINTS = {};
PLAN.points.forEach(p => {
  const txt = p.plan.replace(/<[^>]+>/g," "); const ids = new Set();
  txt.replace(/\b([USAGCMP])(\d+)([a-z]?)(?:\s*[–-]\s*\1?(\d+))?/g, (m, L, a, suf, b) => {
    if (b) for (let i=+a;i<=+b;i++) ids.add(L+i); else ids.add(L+a+suf); return m; });
  POINT_FEATURES[p.id] = [...ids].filter(i => ITEMS.has(i) && ITEMS.get(i).kind==="feature");
  POINT_FEATURES[p.id].forEach(f => (FEATURE_POINTS[f] = FEATURE_POINTS[f] || []).push(p.id));
});

/* ── Moon drawing (phase = lit fraction, lit on the right, waxing) ── */
function moon(phase, size){
  const r = size/2 - 1.5, c = size/2;
  const k = Math.abs(1 - 2*phase) * r, sweep = phase > .5 ? 1 : 0;
  const lit = phase >= .99 ? `<circle cx="${c}" cy="${c}" r="${r}" fill="var(--moon)"/>`
    : `<path d="M${c} ${c-r} A${r} ${r} 0 0 1 ${c} ${c+r} A${k} ${r} 0 0 ${sweep} ${c} ${c-r}Z" fill="var(--moon)"/>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${c}" cy="${c}" r="${r}" fill="var(--moon-shade)" stroke="var(--moon-line)" stroke-width="1"/>${lit}</svg>`;
}
function relPhase(id){ const main = PLAN.releases.filter(r => r.id !== "par"); const i = main.findIndex(r => r.id === id); return i < 0 ? .5 : .12 + .88 * i / Math.max(1, main.length - 1); }
function crystal(size){
  return `<svg width="${size}" height="${size}" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3 L29 20 L20 37 L11 20Z" fill="var(--aether-soft)" stroke="var(--aether)" stroke-width="1.4"/><path d="M20 3 L20 37 M11 20 L29 20" stroke="var(--aether)" stroke-width=".8" opacity=".55"/></svg>`;
}

/* ── Shared store (db) ── */
const S = { db:null, user:null, uid:null, me:null, isOwner:false, canWrite:false, mode:"connecting",
  docs:new Map(), ownerId:null, mine:null, mineLoaded:false, writing:false, dirty:false, profiles:{} };
function emptyMine(){ return { votes:{}, notes:[], role:"player", at:0 }; }
function allDocs(){ const m = new Map(S.docs); if (S.uid && S.mine) m.set(S.uid, S.mine); return m; }
function tallies(){
  const t = {}, n = {}, notes = [];
  allDocs().forEach((d, uid) => {

async function initStore(){

async function flush(){

  S.writing = true;
  try{
    do{ S.dirty = false; S.mine.at = Date.now(); await S.db.doc("reviews/"+S.uid).set(clone(S.mine)); }while(S.dirty);
    if (S.isOwner && S.ownerId !== S.uid){ await S.db.doc("meta/owner").set({ id:S.uid }); }

    else if (code === "quota_exceeded"){ toast("Feedback storage is full. Ask the owner to clear old notes."); }

}

  pane.innerHTML = `<div class="pane-in">
    <div class="kick"><span class="iid">${esc(it.kind==="design" ? (it.tag||it.id) : it.id)}</span>${kick.map(esc).join(" · ")}<button class="btn close" id="closePane" aria-label="Close">Close</button></div>
    <h2>${heading}</h2><div class="full">${body}</div>${links}
    <section><h5><span>Your view</span><span id="vcount"></span></h5>${votesCtl(it)}<div class="voters" id="voters"></div></section>
    <section><h5><span>Comments</span><span id="ncount"></span></h5><div class="s-thread" id="thread"></div>
      <div class="composer" id="composer"></div>${modeNotice()}</section>
    <div class="navrow">${prev ? `<button data-open="${prev}"><b>← Previous</b>${esc(label(prev))}</button>` : "<span></span>"}${next ? `<button class="next" data-open="${next}"><b>Next →</b>${esc(label(next))}</button>` : ""}</div>
  </div>`;
  renderComposer(); renderThread(); renderVoters();
}
function label(id){ const it = ITEMS.get(id); return it.kind==="feature" ? `${id} ${it.title}` : it.kind==="decision" ? `Decision ${it.n}` : it.kind==="point" ? `Point ${it.n}` : it.title; }
function modeNotice(){
  if (S.mode === "live") return "";
  if (S.mode === "connecting") return `<div class="notice">Connecting to shared feedback…</div>`;
  if (S.mode === "readonly") return `<div class="notice warn">You can read everyone's feedback here, but this link doesn't let you post. Ask the owner for Contributor access.</div>`;
  return `<div class="notice warn">Shared feedback needs this page opened on claude.ai while signed in. You can still read the whole proposal.</div>`;
}
function renderVoters(){
  const el = $("#voters"); if (!el || !UI.sel) return; const it = ITEMS.get(UI.sel); const t = T.t[it.id] || {}; const who = t.__who || {};
  const parts = scaleOf(it).filter(([k]) => (who[k]||[]).length).map(([k,l]) => `<span><b style="color:var(--ink-2);font-weight:600">${l}:</b> ${(who[k]||[]).map(u => { const p = person(u); return `${p.avatar?`<img alt="" src="${esc(p.avatar)}">`:""}${esc(p.name)}`; }).join(", ")}</span>`);
  el.innerHTML = parts.join("") || `<span>No votes yet.</span>`;
  const vc = $("#vcount"); if (vc){ const n = Object.keys(t).filter(k => k!=="__who").reduce((a,k) => a+t[k],0); vc.textContent = n ? `${n} vote${n>1?"s":""}` : ""; }
  // keep vote buttons in sync without touching the composer
  document.querySelectorAll('#pane .vbtn').forEach(b => { b.setAttribute("aria-pressed", String(myVote(b.dataset.id) === b.dataset.vote)); const k = b.querySelector(".k"); if (k) k.textContent = (t[b.dataset.vote]||0); b.disabled = !canPost(); });
}
function noteEl(n, children){
  const p = person(n.uid); const wrap = document.createElement("div"); wrap.className = "note";
  const img = document.createElement("img"); img.className = "av"; img.alt = ""; if (p.avatar) img.src = p.avatar; wrap.appendChild(img);
  const box = document.createElement("div"); box.style.minWidth = "0";
  const meta = document.createElement("div"); meta.className = "meta";
  const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = p.isMe ? (p.name === "You" ? "You" : p.name + " (you)") : p.name; meta.appendChild(nm);
  if (p.isOwner){ const b = document.createElement("span"); b.className = "badge owner"; b.textContent = "Owner"; meta.appendChild(b); }
  else if (n.role === "developer" || n.role === "player"){ const b = document.createElement("span"); b.className = "badge"; b.textContent = n.role === "developer" ? "Developer" : "Player"; meta.appendChild(b); }
  const tm = document.createElement("span"); tm.textContent = ago(n.at); tm.title = n.at ? new Date(n.at).toLocaleString() : ""; meta.appendChild(tm);
  box.appendChild(meta);
  const tx = document.createElement("div"); tx.className = "txt"; tx.textContent = n.text; box.appendChild(tx);
  const acts = document.createElement("div"); acts.className = "s-acts";
  if (canPost() && !n.re){ const r = document.createElement("button"); r.textContent = "Reply"; r.dataset.reply = n.id; acts.appendChild(r); }
  if (canPost() && n.uid === S.uid){ const d = document.createElement("button"); d.textContent = "Delete"; d.dataset.del = n.id; acts.appendChild(d); }
  if (acts.childNodes.length) box.appendChild(acts);
  if (children && children.length){ const rp = document.createElement("div"); rp.className = "replies"; children.forEach(c => rp.appendChild(noteEl(c))); box.appendChild(rp); }
  wrap.appendChild(box); return wrap;
}
function renderThread(){
  const el = $("#thread"); if (!el || !UI.sel) return;
  const mine = T.notes.filter(n => n.item === UI.sel).sort((a,b) => (a.at||0)-(b.at||0));
  const top = mine.filter(n => !n.re || !mine.some(m => m.id === n.re));
  el.replaceChildren(...top.map(n => noteEl(n, mine.filter(m => m.re === n.id))));
  if (!top.length){ const e = document.createElement("div"); e.className = "nothread"; e.textContent = canPost() ? "No comments yet. Say what you'd change, keep or drop." : "No comments yet."; el.appendChild(e); }
  const nc = $("#ncount"); if (nc) nc.textContent = mine.length ? String(mine.length) : "";
}
function renderComposer(){
  const el = $("#composer"); if (!el) return;
  if (!canPost()){ el.innerHTML = ""; return; }
  const draft = LS.get("draft:"+UI.sel, "");
  const rt = UI.replyTo && T.notes.find(n => n.id === UI.replyTo);
  el.innerHTML = `${rt ? `<div class="replying">Replying to ${esc(person(rt.uid).name)} <button class="linkbtn" id="cancelReply">Cancel</button></div>` : ""}
    <label for="cbox" class="eyebrow" style="letter-spacing:.12em">Your comment</label>
    <textarea id="cbox" maxlength="4000" placeholder="${rt ? "Write a reply…" : "What would you change, keep or drop?"}"></textarea>
    <div class="row"><span>Ctrl + Enter to post. Everyone with this link sees it.</span><button class="btn primary" id="post">Post</button></div>`;
  $("#cbox").value = draft;
}
function post(){
  const box = $("#cbox"); if (!box) return; const text = box.value.trim(); if (!text) { box.focus(); return; }
  const note = { id: Math.random().toString(36).slice(2,10) + Date.now().toString(36), item: UI.sel, text: text.slice(0,4000), at: Date.now() };
  if (UI.replyTo) note.re = UI.replyTo;
  mutate(m => { m.notes.push(note); });
  LS.set("draft:"+UI.sel, ""); UI.replyTo = null; renderComposer(); renderThread(); toast("Posted");
}

/* Feed (All feedback view) */
function renderFeed(){
  const el = $("#feed"); if (!el) return;
  const feed = [...T.notes].sort((a,b) => (b.at||0)-(a.at||0)).slice(0,80);
  if (!feed.length) return;
  el.replaceChildren(...feed.map(n => {
    const b = document.createElement("button"); b.className = "fi"; b.dataset.open = n.item;
    const p = person(n.uid); const img = document.createElement("img"); img.className = "av"; img.alt = ""; img.style.cssText = "width:30px;height:30px;border-radius:50%"; if (p.avatar) img.src = p.avatar;
    const box = document.createElement("div"); box.style.minWidth = "0";
    const meta = document.createElement("div"); meta.className = "meta"; meta.style.cssText = "display:flex;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3)";
    const nm = document.createElement("span"); nm.style.cssText = "color:var(--ink);font-weight:600"; nm.textContent = p.name; meta.appendChild(nm);
    const on = document.createElement("span"); on.textContent = "on " + label(n.item); meta.appendChild(on);
    const tm = document.createElement("span"); tm.textContent = ago(n.at); meta.appendChild(tm);
    const tx = document.createElement("div"); tx.style.cssText = "margin-top:3px;font-size:14px;color:var(--ink-2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;white-space:pre-wrap"; tx.textContent = n.text;
    box.append(meta, tx); b.append(img, box); return b; }));
}
function ago(t){ if (!t) return ""; const s = (Date.now()-t)/1000; if (s < 60) return "just now"; if (s < 3600) return Math.floor(s/60)+" min ago"; if (s < 86400) return Math.floor(s/3600)+" h ago"; if (s < 86400*7) return Math.floor(s/86400)+" d ago"; return new Date(t).toLocaleDateString(undefined,{day:"numeric",month:"short"}); }
let toastT; function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2200); }

/* Import answers from the earlier version of this page */
function offerImport(){
  const slot = $("#importSlot"); if (slot) slot.innerHTML = ""; return; /* plan 7 has new decisions; nothing to import */
  let old = null; try{ old = JSON.parse(localStorage.getItem("tsukimichi-plan6-answers") || "null"); }catch(e){}
  if (!old || LS.get("imported", false)) { slot.innerHTML = ""; return; }
  const n = Object.values(old).filter(v => v && (v.v || v.note)).length; if (!n){ slot.innerHTML = ""; return; }
  slot.innerHTML = `<button class="btn" id="doImport">Bring over ${n} answer${n>1?"s":""} from the earlier page</button>`;
}
function doImport(){
  let old = {}; try{ old = JSON.parse(localStorage.getItem("tsukimichi-plan6-answers") || "{}"); }catch(e){}
  mutate(m => { Object.entries(old).forEach(([n, a]) => { const id = "D"+n; if (!ITEMS.has(id) || !a) return;
    if (a.v && !m.votes[id]) m.votes[id] = a.v;
    if (a.note && a.note.trim()) m.notes.push({ id: Math.random().toString(36).slice(2,10)+Date.now().toString(36), item:id, text:a.note.trim().slice(0,4000), at:Date.now() }); }); });
  LS.set("imported", true); renderMain(); toast("Earlier answers brought over");
}
function copyAnswers(){
  const lines = ["Plan 9 decisions:"];
  PLAN.decisions.forEach(d => { const v = myVote(d.id); const l = v ? (SCALES.decision.find(x => x[0]===v)||[])[1] : "(no answer)";
    const notes = T.notes.filter(n => n.item === d.id && n.uid === S.uid).map(n => n.text.replace(/\s+/g," "));
    lines.push(`${d.n}. ${d.title} -> ${l}${notes.length ? " - " + notes.join(" / ") : ""}`); });
  const text = lines.join("\n"), note = $("#copyNote");
  const fallback = () => { const ta = document.createElement("textarea"); ta.value = text; ta.style.cssText = "width:100%;min-height:200px;margin-top:10px"; ta.readOnly = true; note.textContent = "Select the text below and copy it."; note.after(ta); ta.select(); };
  try{ navigator.clipboard.writeText(text).then(() => { note.textContent = "Copied. Paste it into the chat."; }, fallback); }catch(e){ fallback(); }
}

/* ── Refresh cycle ── */
function renderAll(){ renderTabs(); renderRoad(); renderRail(); renderMain(); renderPane(); renderStats(); renderWho(); }
function renderLive(){
  // Updates that never touch text being typed: tallies, counts, chips, thread, feed.
  renderStats(); renderTabs(); renderRail();
  document.querySelectorAll("[data-item]").forEach(el => {
    const id = el.dataset.item, it = ITEMS.get(id); if (!it) return;
    const bar = el.querySelector(".tally"); if (bar) bar.outerHTML = tallyBar(id, it.kind);
    const cc = el.querySelector(".cc"); if (cc) cc.outerHTML = ccount(id);
    const chip = el.querySelector(".myv"); const html = myChip(id, it.kind);
    if (chip) chip.outerHTML = html || "<span></span>"; else if (html){ const top = el.querySelector(".top") || el.querySelector(".side"); if (top) top.insertAdjacentHTML("beforeend", html); }
  });
  document.querySelectorAll("[data-dec]").forEach(el => { const id = el.dataset.dec, t = T.t[id] || {};
    el.querySelectorAll(".vbtn").forEach(b => { b.setAttribute("aria-pressed", String(myVote(id) === b.dataset.vote)); b.querySelector(".k").textContent = t[b.dataset.vote]||0; b.disabled = !canPost(); });
    const d = el.querySelector("[data-open]"); if (d) d.textContent = `Discuss · ${T.n[id]||0}`; });
  if (UI.view === "feedback" && !$("#main .ft tbody tr:hover")) { /* table counts */ renderMainKeepScroll(); }
  renderVoters(); renderThread(); renderFeed();
}
function renderMainKeepScroll(){ const y = window.scrollY; renderMain(); window.scrollTo(0, y); }
let refreshQueued = false;
function refresh(){ if (refreshQueued) return; refreshQueued = true; requestAnimationFrame(() => { refreshQueued = false; T = tallies(); renderLive(); renderWho(); resolveProfiles(); if (!$("#cbox") && canPost() && UI.sel) renderComposer(); }); }

/* ── Events ── */
document.addEventListener("click", e => {
  if (e.target.closest(".mk")) return;
  const t = e.target.closest("button, [data-item], .relchip"); if (!t) return;
  if (t.dataset.view){ go(t.dataset.view); return; }
  if (t.dataset.rel){ const v = t.dataset.rel; const r = PLAN.releases.find(x => x.id === v || x.ver === v);
    UI.rel = v === "all" ? "all" : (r ? r.id : UI.rel); LS.set("rel", UI.rel); UI.view = "proposal"; LS.set("view","proposal"); renderAll(); window.scrollTo({top: $("#shell").offsetTop - 70, behavior:"smooth"}); return; }
  if (t.dataset.filter){ UI.filter = t.dataset.filter; LS.set("filter", UI.filter); renderRail(); renderMain(); return; }
  if (t.dataset.vote){ const id = t.dataset.id, v = t.dataset.vote; mutate(m => { if (m.votes[id] === v) delete m.votes[id]; else m.votes[id] = v; }); return; }
  if (t.dataset.role){ const r = t.dataset.role; mutate(m => { m.role = r; }); renderWho(); return; }
  if (t.dataset.reply){ UI.replyTo = t.dataset.reply; renderComposer(); $("#cbox").focus(); return; }
  if (t.dataset.del){
    if (!t.classList.contains("armed")){ t.classList.add("armed"); t.textContent = "Click again to delete"; setTimeout(() => { if (t.isConnected){ t.classList.remove("armed"); t.textContent = "Delete"; } }, 3000); return; }
    const id = t.dataset.del; mutate(m => { m.notes = m.notes.filter(n => n.id !== id && n.re !== id); }); toast("Comment deleted"); return; }
  if (t.dataset.open){ select(t.dataset.open); return; }
  if (t.id === "post"){ post(); return; }
  if (t.id === "cancelReply"){ UI.replyTo = null; renderComposer(); return; }
  if (t.id === "closePane"){ document.body.classList.remove("pane-open"); return; }
  if (t.id === "copyAns"){ copyAnswers(); return; }
  if (t.id === "doImport"){ doImport(); return; }
  if (t.dataset.item && !e.target.closest("a")){ select(t.dataset.item); return; }
});
$("#scrim").addEventListener("click", () => document.body.classList.remove("pane-open"));
document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest(".mk")) return;
  if (e.target.id === "cbox" && e.key === "Enter" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); post(); return; }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-item][tabindex]")){ e.preventDefault(); select(e.target.dataset.item); return; }
  if (e.key === "Escape") document.body.classList.remove("pane-open");
});
let draftT; document.addEventListener("input", e => { if (e.target.id === "cbox"){ const v = e.target.value, id = UI.sel; clearTimeout(draftT); draftT = setTimeout(() => LS.set("draft:"+id, v), 300); } });
window.addEventListener("hashchange", () => { hashIn(); renderAll(); });

hashIn(); renderAll();
initStore().catch(() => setMode("offline"));
setTimeout(() => { if (S.mode === "connecting") setMode("offline"); }, 12000);
})();
</script>
