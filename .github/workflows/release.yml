name: Release

# Push a tag like v0.2.0 to build the plugin against the current Dalamud, attach latest.zip to a
# GitHub Release, and refresh pluginmaster.json on main so custom-repo users get the update.
#
# Guards: the tag must equal the csproj <Version> (an -rcN suffix is allowed on the tag), the csproj
# must carry a TsukimichiTestedGameVersion (the addon kill switch's tested game version), and a
# non-prerelease tag must have its CHANGELOG.md section. A tag containing "-" is published as a
# prerelease and never touches pluginmaster.json.
#
# Run it by hand (workflow_dispatch) with an existing tag to publish that tag again, without a new
# tag: pluginmaster.json is regenerated, and the release is created if it is missing. A release that
# exists keeps its notes and assets; only a missing latest.zip is attached (with its SHA256SUMS.txt
# and a "Rebuilt on" line heading the notes), since a rebuild is not byte-identical and replacing
# latest.zip would break the hashes players already checked.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish again, e.g. v0.5.1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          # Full history: CuratedInvariantsTests checks VERSION.json against the last commit that touched the curated data.
          fetch-depth: 0

      - name: Resolve the tag
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)(-[0-9A-Za-z.]+)?$') {
            Write-Host "::error::Tag '$tag' is not of the form vX.Y.Z or vX.Y.Z-suffix."
            exit 1
          }
          $base = $Matches[1]
          $suffix = if ($Matches[2]) { $Matches[2] } else { '' }
          $prerelease = $suffix -ne ''
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_VERSION=$base" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_SUFFIX=$suffix" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_PRERELEASE=$($prerelease.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "tag $tag -> version $base, suffix '$suffix', prerelease $prerelease"

      - name: Guard - csproj Version equals the tag
        shell: pwsh
        run: |
          $csproj = [xml](Get-Content Tsukimichi/Tsukimichi.csproj -Raw)
          $version = ($csproj.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ } | Select-Object -First 1)
          if (-not $version) {
            Write-Host "::error::Tsukimichi/Tsukimichi.csproj has no <Version>."
            exit 1
          }
          $version = $version.Trim()
          # The csproj carries a four-part version (0.5.1.0); the tag names the first three.
          $short = $version -replace '^(\d+\.\d+\.\d+)\.0$', '$1'
          if ($env:RELEASE_SUFFIX -ne '' -and $env:RELEASE_SUFFIX -notmatch '^-rc\d+$') {
            Write-Host "::error::Tag suffix '$env:RELEASE_SUFFIX' is not allowed; only -rcN is."
            exit 1
          }
          if ($short -ne $env:RELEASE_VERSION) {
            Write-Host "::error::Tag $env:RELEASE_TAG names version $env:RELEASE_VERSION but Tsukimichi.csproj has <Version>$version</Version>. Bump the csproj or retag."
            exit 1
          }
          Write-Host "csproj Version $version matches tag $env:RELEASE_TAG"

      - name: Guard - csproj TsukimichiTestedGameVersion is set and not older than the shipped data
        # The game hooks pause on any game newer than this version (Core/Runtime/HookGate.cs); an empty value would
        # ship a build whose kill switch never acts. Bump it with tools/set-tested-version.ps1 (CONTRIBUTING.md).
        shell: pwsh
        run: |
          $csproj = [xml](Get-Content Tsukimichi/Tsukimichi.csproj -Raw)
          $tested = ($csproj.Project.PropertyGroup | ForEach-Object { $_.TsukimichiTestedGameVersion } | Where-Object { $_ -and $_.Trim() } | Select-Object -First 1)
          if (-not $tested) {
            Write-Host "::error::Tsukimichi/Tsukimichi.csproj has no <TsukimichiTestedGameVersion> or it is empty. Play-test the game hooks and run tools/set-tested-version.ps1 before tagging."
            exit 1
          }
          $tested = $tested.Trim()
          if ($tested -notmatch '^\d{4}\.\d{2}\.\d{2}\.\d{4}\.\d{4}$') {
            Write-Host "::error::TsukimichiTestedGameVersion '$tested' is not a game version of the form 2026.09.15.0000.0000."
            exit 1
          }
          # The shipped data was generated from a game version; hooks tested on an older one would pause on the very
          # game the data describes. Compared part by part as numbers.
          $raw = Get-Content Tsukimichi/Data/unique_quests.json -Raw
          $dataVersion = [regex]::Match($raw, '"gameVersion"\s*:\s*"([^"]+)"').Groups[1].Value
          if ($dataVersion -notmatch '^\d{4}\.\d{2}\.\d{2}\.\d{4}\.\d{4}$') {
            Write-Host "::error::Tsukimichi/Data/unique_quests.json has no gameVersion of the form 2026.09.15.0000.0000 (found '$dataVersion')."
            exit 1
          }
          $testedParts = $tested.Split('.') | ForEach-Object { [int]$_ }
          $dataParts = $dataVersion.Split('.') | ForEach-Object { [int]$_ }
          $order = 0
          for ($i = 0; $i -lt 5 -and $order -eq 0; $i++) { $order = $testedParts[$i].CompareTo($dataParts[$i]) }
          if ($order -lt 0) {
            Write-Host "::error::TsukimichiTestedGameVersion $tested is older than the game version the shipped data was generated from ($dataVersion in unique_quests.json). Play-test the game hooks on $dataVersion or later and run tools/set-tested-version.ps1."
            exit 1
          }
          Write-Host "Game hooks tested on game $tested (shipped data from $dataVersion)"

      - name: Guard - CHANGELOG.md has the version's section
        if: env.RELEASE_PRERELEASE == 'false'
        shell: pwsh
        run: |
          $lines = Get-Content CHANGELOG.md
          $heading = "## [$env:RELEASE_VERSION]"
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i].StartsWith($heading)) { $start = $i; break }
          }
          if ($start -lt 0) {
            Write-Host "::error::CHANGELOG.md has no '$heading' section for tag $env:RELEASE_TAG. Add it (or tag an -rcN prerelease to skip this check)."
            exit 1
          }
          $bullets = 0
          for ($i = $start + 1; $i -lt $lines.Count -and -not $lines[$i].StartsWith('## '); $i++) {
            if ($lines[$i].TrimStart().StartsWith('- ')) { $bullets++ }
          }
          if ($bullets -eq 0) {
            Write-Host "::error::CHANGELOG.md section '$heading' has no bullet; write the release notes before tagging."
            exit 1
          }
          Write-Host "CHANGELOG.md section '$heading' found with $bullets bullet(s)"

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Download Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
          Expand-Archive dalamud.zip -DestinationPath "$env:RUNNER_TEMP\dalamud"
          "DALAMUD_HOME=$env:RUNNER_TEMP\dalamud" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Release package
        # The whole solution with warnings as errors, so a tag never builds what CI would reject;
        # the plugin project's build is what packs latest.zip.
        run: dotnet build Tsukimichi.sln -c Release -warnaserror

      - name: Load check (every UI language, Dalamud's Lumina)
        # The same check as ci.yml, against the Dalamud this release is built with: the plugin loads outside the game
        # in every UI language, and every Lumina member GameData uses exists in Dalamud's Lumina.
        run: dotnet run --project tools/Tsukimichi.LoadCheck -c Release --no-build

      - name: Test
        # The timing tests (Category=Perf) have developer-machine budgets; see ci.yml.
        run: dotnet test Tsukimichi.Tests -c Release --no-build --filter "Category!=Perf"

      # The solution builds the plugin under bin/x64/Release; the package step and make_pluginmaster.py read
      # bin/Release, so build the plugin project on its own as the packaging step (incremental, seconds).
      - name: Build the plugin package
        run: dotnet build Tsukimichi/Tsukimichi.csproj -c Release

      - name: Hash latest.zip and the Tsukimichi.dll inside it
        # Trust you can check (feature plan v7 N2): the SHA-256 of latest.zip and of the Tsukimichi.dll inside it (the
        # very file Dalamud installs and the game loads) go into SHA256SUMS.txt, in sha256sum's format, attached to the
        # release beside latest.zip, and into the top of the release notes. Settings > Advanced > Privacy & trust shows
        # the same hash of the DLL a player is running. Nothing here changes latest.zip or pluginmaster.json.
        shell: pwsh
        run: |
          $package = 'Tsukimichi/bin/Release/Tsukimichi'
          $zip = Join-Path $package 'latest.zip'
          if (-not (Test-Path $zip)) { Write-Host "::error::$zip was not built."; exit 1 }
          $extract = Join-Path $env:RUNNER_TEMP 'latest-zip'
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          Expand-Archive $zip -DestinationPath $extract
          $dll = Join-Path $extract 'Tsukimichi.dll'
          if (-not (Test-Path $dll)) { Write-Host "::error::latest.zip has no Tsukimichi.dll at its root."; exit 1 }
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $dllHash = (Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant()

          # sha256sum's format: hash, two spaces, name; LF line ends, no BOM, so `sha256sum -c` reads it.
          $sums = Join-Path (Resolve-Path $package).Path 'SHA256SUMS.txt'
          [IO.File]::WriteAllText($sums, "$zipHash  latest.zip`n$dllHash  Tsukimichi.dll`n")

          $privacy = "https://github.com/${{ github.repository }}/blob/$env:RELEASE_TAG/docs/privacy.md"
          $notes = @(
            '### Verify this build',
            '',
            'SHA-256 of the files this release ships (also in `SHA256SUMS.txt` below). Letter case does not matter: PowerShell''s `Get-FileHash` prints capitals.',
            '',
            '| File | SHA-256 |',
            '|---|---|',
            "| ``latest.zip`` | ``$zipHash`` |",
            "| ``Tsukimichi.dll`` (inside latest.zip; the file the game loads) | ``$dllHash`` |",
            '',
            "In game, Settings > Advanced > Privacy & trust shows the SHA-256 of the Tsukimichi.dll you are running: it matches the one above when you run this release. What the plugin reads and sends: [docs/privacy.md]($privacy).",
            ''
          ) -join "`n"
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          [IO.File]::WriteAllText($notesPath, $notes)
          "RELEASE_NOTES_PATH=$notesPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "latest.zip      $zipHash"
          Write-Host "Tsukimichi.dll  $dllHash"

      - name: Look up the existing release (manual run)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $json = gh release view "$env:RELEASE_TAG" --repo "${{ github.repository }}" --json body,assets 2>$null
          if ($LASTEXITCODE -ne 0 -or -not $json) {
            Write-Host "No release for $env:RELEASE_TAG yet; it is created as on a tag push"
            "RELEASE_EXISTS=false" | Out-File -FilePath $env:GITHUB_ENV -Append
            exit 0
          }
          $release = $json | ConvertFrom-Json
          $names = @($release.assets | ForEach-Object { $_.name })
          $bodyPath = Join-Path $env:RUNNER_TEMP 'release-body.md'
          [IO.File]::WriteAllText($bodyPath, [string]$release.body)
          "RELEASE_EXISTS=true" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_HAS_ZIP=$(($names -contains 'latest.zip').ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_BODY_PATH=$bodyPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Release $env:RELEASE_TAG exists with assets: $($names -join ', ')"
          exit 0

      - name: Attach what is missing to the existing release (manual run)
        # Players may already have installed this release and checked its hashes: its latest.zip, SHA256SUMS.txt and
        # notes stay as they are. Only a release without latest.zip (a run that failed before attaching it) gets the
        # rebuilt one, its SHA256SUMS.txt, and the new hashes at the top of the notes under a "Rebuilt on" line.
        if: env.RELEASE_EXISTS == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:RELEASE_HAS_ZIP -eq 'true') {
            Write-Host "::notice::$env:RELEASE_TAG already has latest.zip; its assets and notes are kept unchanged."
            exit 0
          }
          $package = 'Tsukimichi/bin/Release/Tsukimichi'
          gh release upload "$env:RELEASE_TAG" "$package/latest.zip" "$package/SHA256SUMS.txt" --clobber --repo "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::could not attach latest.zip to $env:RELEASE_TAG"; exit 1 }
          $date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
          $notes = [IO.File]::ReadAllText($env:RELEASE_NOTES_PATH)
          $existing = [IO.File]::ReadAllText($env:RELEASE_BODY_PATH)
          $body = "_Rebuilt on $date (UTC): latest.zip attached; the hashes below are this build's._`n`n$notes`n$existing"
          $bodyPath = Join-Path $env:RUNNER_TEMP 'release-body-rebuilt.md'
          [IO.File]::WriteAllText($bodyPath, $body)
          gh release edit "$env:RELEASE_TAG" --notes-file $bodyPath --repo "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::could not update the notes of $env:RELEASE_TAG"; exit 1 }
          Write-Host "latest.zip attached to $env:RELEASE_TAG"

      - name: Create the GitHub Release with latest.zip
        # The hashes above head the notes; GitHub's generated notes follow them. A manual run on a release that
        # exists is handled above instead.
        if: env.RELEASE_EXISTS != 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Tsukimichi ${{ env.RELEASE_TAG }}
          files: |
            Tsukimichi/bin/Release/Tsukimichi/latest.zip
            Tsukimichi/bin/Release/Tsukimichi/SHA256SUMS.txt
          body_path: ${{ env.RELEASE_NOTES_PATH }}
          prerelease: ${{ env.RELEASE_PRERELEASE == 'true' }}
          generate_release_notes: true

      - name: Refresh pluginmaster.json on main
        if: env.RELEASE_PRERELEASE == 'false'
        shell: pwsh
        run: |
          python tools/make_pluginmaster.py --tag "$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item pluginmaster.json "$env:RUNNER_TEMP\pluginmaster.json"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          Copy-Item "$env:RUNNER_TEMP\pluginmaster.json" pluginmaster.json
          git add pluginmaster.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "pluginmaster.json unchanged"; exit 0 }
          git commit -m "chore: pluginmaster.json for $env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::could not commit pluginmaster.json"; exit 1 }

          # Something may land on main while the build runs; fetch and rebase between tries. The regenerated
          # file always wins a conflict on pluginmaster.json (the commit being replayed is "theirs" in a rebase).
          $env:GIT_EDITOR = 'true'
          $pushed = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            git push origin main
            if ($LASTEXITCODE -eq 0) { $pushed = $true; break }
            Write-Host "push rejected (attempt $attempt of 3); fetching and rebasing onto origin/main"
            git fetch origin main
            git rebase origin/main
            if ($LASTEXITCODE -ne 0) {
              git checkout --theirs pluginmaster.json
              git add pluginmaster.json
              git rebase --continue
              if ($LASTEXITCODE -ne 0) { git rebase --abort; Write-Host "::error::could not rebase the pluginmaster commit"; exit 1 }
            }
          }
          if (-not $pushed) {
            Write-Host "::error::pluginmaster.json push rejected three times; run the workflow again with tag $env:RELEASE_TAG"
            exit 1
          }
          Write-Host "pluginmaster.json pushed to main for $env:RELEASE_TAG"
